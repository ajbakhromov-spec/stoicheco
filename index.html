<title>EcoChem Stoichiometry Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lab notebook. Left: the level ladder (or teacher controls / lab bench). Right: one worked solution that grows step by step.
   Chemistry working is written in cobalt ink; the eco layer is leaf green; final answers sit on a burette-amber card. */
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EEEA; --ink:#14221B; --muted:#56665E; --line:#D2DCD6;
  --chem:#2B45A3; --chem-soft:#E3E8F8; --on-chem:#FFFFFF;
  --eco:#2C7A4B; --eco-soft:#DEF0E4; --on-eco:#FFFFFF;
  --amber:#9A5B0C; --amber-soft:#F7EAD3;
  --bad:#B42318; --bad-soft:#FBE3DF; --good:#1D7443;
  --in0:#3F5BC4; --in1:#7088DA; --in2:#A3B3EA; --by:#B7C2BC; --emit:#C98A2E; --want:#2C7A4B;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1512; --surface:#151F1A; --sunk:#1C2822; --ink:#E2EBE5; --muted:#93A49A; --line:#2B3A33;
  --chem:#93A8F2; --chem-soft:#1F2A4A; --on-chem:#0E1512;
  --eco:#6FC793; --eco-soft:#173324; --on-eco:#0E1512;
  --amber:#E8B65A; --amber-soft:#33281A;
  --bad:#F08A7E; --bad-soft:#3A1D1A; --good:#6FC793;
  --in0:#6F87E0; --in1:#5268B8; --in2:#3C4C88; --by:#4E5C55; --emit:#C98A2E; --want:#4FAF76;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0E1512; --surface:#151F1A; --sunk:#1C2822; --ink:#E2EBE5; --muted:#93A49A; --line:#2B3A33;
  --chem:#93A8F2; --chem-soft:#1F2A4A; --on-chem:#0E1512;
  --eco:#6FC793; --eco-soft:#173324; --on-eco:#0E1512;
  --amber:#E8B65A; --amber-soft:#33281A;
  --bad:#F08A7E; --bad-soft:#3A1D1A; --good:#6FC793;
  --in0:#6F87E0; --in1:#5268B8; --in2:#3C4C88; --by:#4E5C55; --emit:#C98A2E; --want:#4FAF76;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
sub,sup{font-size:.72em;line-height:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chem);outline-offset:2px;border-radius:4px}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 28px;padding-block:20px 0}
.brand{min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.55rem,3.2vw,2.2rem);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.brand h1 b{color:var(--eco);font-weight:800}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 16px;font-size:.9rem;color:var(--muted)}
.flow span{padding:2px 10px;border-radius:999px;background:var(--chem-soft);color:var(--chem);font-weight:700}
.flow span.e{background:var(--eco-soft);color:var(--eco)}
.flow i{font-style:normal;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:10px 14px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab small{display:block;font-weight:400;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--chem)}
.tab:hover{color:var(--ink)}
main{padding-block:26px 72px}

/* shared layout */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding-right:4px}
@media (max-width:900px){.side{position:static;max-height:none}.ladder-panel{max-height:300px;overflow:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
h2.ptitle{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,2.4vw,1.7rem);letter-spacing:-.01em;margin:0;line-height:1.15;text-wrap:balance}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.head > div{min-width:0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.pill.ext{background:var(--amber-soft);color:var(--amber)}

/* ladder */
.method{font-size:.88rem;color:var(--muted);margin:0}
.method b{color:var(--ink)}
.level{display:flex;flex-direction:column;gap:2px}
.level h3{font-family:var(--f-display);font-size:1rem;font-weight:700;margin:0;display:flex;gap:8px;align-items:baseline}
.level h3 .ln{font-family:var(--f-mono);font-size:.78rem;color:var(--chem);font-weight:600}
.level p{margin:0 0 6px;font-size:.82rem;color:var(--muted)}
.prob{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}
.prob:hover{background:var(--sunk)}
.prob[aria-current="true"]{background:var(--chem-soft)}
.prob .pid{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.prob .pt{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{font-size:.8rem;letter-spacing:1px;color:var(--amber);white-space:nowrap}
.stars .off{color:var(--line)}
.levels{display:flex;flex-direction:column;gap:14px}

/* segmented control */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg-help{font-size:.82rem;color:var(--muted);margin:6px 2px 0}

/* player */
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.rail li{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);display:flex;align-items:center;gap:5px}
.rail li.done{background:var(--chem-soft);border-color:transparent;color:var(--chem)}
.rail li.now{background:var(--chem);border-color:var(--chem);color:var(--on-chem)}
.rail li.skip{text-decoration:line-through;opacity:.55}
.rail li.eco.done{background:var(--eco-soft);color:var(--eco)}
.rail li.eco.now{background:var(--eco);border-color:var(--eco);color:var(--on-eco)}
.rail .leaf{width:14px;height:14px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px}
.step > .num{grid-row:1 / span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .82rem var(--f-mono);background:var(--chem-soft);color:var(--chem)}
.step > h3{margin:3px 0 8px;font:700 1.05rem var(--f-display);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.step > h3 small{font:400 .82rem var(--f-body);color:var(--muted)}
.step > .body{min-width:0;grid-column:2}
.step.skipped{background:transparent;border-style:dashed;padding-block:10px}
.step.skipped > .num{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.step.skipped > h3{color:var(--muted);margin-bottom:2px}
.step.skipped .body{color:var(--muted);font-size:.92rem}
.step.skipped .body p{margin:0}
.step.current{border-color:var(--chem);box-shadow:0 0 0 3px var(--chem-soft)}
.step.eco{border-color:var(--eco)}
.step.eco > .num{background:var(--eco-soft);color:var(--eco)}
.step.eco.current{box-shadow:0 0 0 3px var(--eco-soft)}
.qtext{font-size:1.08rem;margin:0;max-width:68ch}
.eq{font-size:1.25rem;padding:12px 14px;background:var(--sunk);border-radius:8px;overflow-x:auto;white-space:nowrap;line-height:2}
.eq .co{font-weight:700;color:var(--chem);margin-right:1px}
.eq .st{font-size:.68em;color:var(--muted);margin-left:1px}
.eq .arrow{color:var(--chem);font-weight:700;margin:0 .35em}
.eq .op{color:var(--muted);margin:0 .2em}
.note{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.note.bad{color:var(--bad)}
.calc{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.calc p{margin:0;padding:3px 0 3px 12px;border-left:2px solid var(--chem-soft);overflow-wrap:anywhere}
.calc p b{color:var(--chem)}
.calc .sub{font-weight:700;color:var(--muted);font-size:.85rem;letter-spacing:.03em}
.calc.muted p{color:var(--muted);border-left-color:var(--line)}
.calc.muted{margin-top:6px}
.ask{margin:0 0 10px;font-weight:700}
.checks{display:flex;flex-direction:column;gap:10px}
.check{border:1px dashed var(--chem);background:var(--chem-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.check.ok{border-style:solid;border-color:var(--good);background:transparent}
.check.shown{border-style:solid;border-color:var(--line);background:transparent}
.guide{margin:0;font-size:.9rem;color:var(--chem)}
.guide::before{content:"Set up: ";font-weight:700}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.crow label{font-weight:700}
.crow input{width:10rem;max-width:100%;font:600 1rem var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.crow .unit{color:var(--muted);font-weight:700}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}
.choice:hover{border-color:var(--chem)}
.fb{margin:0;font-size:.92rem}
.fb.ok{color:var(--good);font-weight:700}
.fb.bad{color:var(--bad)}
.fb.tip{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--chem);border-color:var(--chem);color:var(--on-chem)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.eco{background:var(--eco);border-color:var(--eco);color:var(--on-eco)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.controls .spacer{flex:1}
.answer-box{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:14px 16px;border-radius:10px;background:var(--amber-soft)}
.answer-box span{font-weight:700}
.answer-box strong{font:800 1.5rem var(--f-display);color:var(--amber);font-variant-numeric:tabular-nums}
.answer-box em{font-style:normal;font-size:.8rem;color:var(--muted)}
.done-banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:12px}
.done-banner p{margin:0}
.done-banner .stars{font-size:1.15rem}
.error-card{padding:16px;border-radius:12px;border:1px solid var(--bad);background:var(--bad-soft)}
.error-card p{margin:4px 0 0}
.ask-q{font:600 1.05rem var(--f-mono);margin:0}
.ask-q .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--chem);text-align:center;color:var(--chem)}

/* eco */
.eco-kicker{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--eco)}
.leaf{width:18px;height:18px;flex:none}
.eco-result{margin:0 0 12px}
.eco-result b{color:var(--amber)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.metric{padding:10px 12px;border-radius:10px;background:var(--eco-soft);min-width:0}
.metric span{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.metric b{display:block;font:700 1.2rem var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.metric small{display:block;font-size:.78rem;color:var(--muted)}
.eco-text{max-width:70ch;margin:12px 0}
.think{border-left:4px solid var(--eco);padding:8px 14px;background:var(--eco-soft);border-radius:0 8px 8px 0;margin-top:12px}
.think span{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--eco)}
.think p{margin:2px 0 0}
.cap{font-size:.8rem;color:var(--muted);font-weight:700;margin:0 0 6px}
.mb{margin:6px 0 12px;display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:center}
.mlab{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mbar{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;background:var(--sunk)}
.mbar i{display:flex;align-items:center;justify-content:center;min-width:3px;font-style:normal;font-size:.78rem;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.mbar i span{padding:0 6px;text-overflow:ellipsis;overflow:hidden}
.in0{background:var(--in0)} .in1{background:var(--in1)} .in2{background:var(--in2)}
.want{background:var(--want)} .emit{background:var(--emit)} .by{background:var(--by)}
.mbar i.by,.mbar i.in2{color:var(--ink)}
.xs{background:repeating-linear-gradient(135deg,var(--by) 0 5px,var(--sunk) 5px 10px)}
.mbar i.xs{color:var(--ink)}
.mleg{list-style:none;margin:0 0 4px 3.25em;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem}
.mleg li{display:flex;align-items:center;gap:6px}
.mleg li i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mleg.key{color:var(--muted);font-size:.78rem}
.tbl-wrap{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 12px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.78rem;color:var(--muted)}
.sources{display:flex;flex-direction:column;gap:5px;margin:4px 0 8px}
.sbar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 6em;gap:8px;align-items:center;font-size:.86rem}
.sbar i{display:block;height:12px;width:var(--w);background:var(--eco);border-radius:3px}
.sbar b{text-align:right;font-variant-numeric:tabular-nums}
.slider{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:700;margin:4px 0 10px;max-width:420px}
.slider input{width:100%;accent-color:var(--eco)}
.yield{margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.yield p{margin:6px 0 0;max-width:70ch}
.ybar{height:12px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--by) 0 5px,var(--sunk) 5px 10px);overflow:hidden}
.ybar i{display:block;height:100%;background:var(--want)}

/* teacher board */
.projector .step{font-size:1.18rem}
.projector .qtext{font-size:1.35rem}
.projector .eq{font-size:1.6rem}
.projector .ask-q{font-size:1.3rem}
.whatif{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.field > span{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.field textarea{font-family:var(--f-mono);font-size:.95rem;resize:vertical}
.plist{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
@media (max-width:900px){.plist{max-height:260px}}
.kbd{font:600 .75rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.hint-line{font-size:.82rem;color:var(--muted);margin:0}

/* lab */
.labform{display:flex;flex-direction:column;gap:14px}
.fgroup{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.fgroup:first-child{border-top:0;padding-top:0}
.fgroup > .eyebrow{margin:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.err{color:var(--bad);margin:0;font-size:.92rem}
.err:empty{display:none}
.hidden{display:none}
footer{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:.84rem}
footer p{margin:0;max-width:90ch}

@media (max-width:520px){
  .step{grid-template-columns:minmax(0,1fr);padding:14px}
  .step > .num{grid-row:auto;margin-bottom:4px}
  .step > .body, .step > h3{grid-column:1}
  .eq{font-size:1.05rem}
  .mleg{margin-left:0}
  .sbar{grid-template-columns:6.5em minmax(0,1fr) 5em}
}

.tagline{margin:6px 0 16px;color:var(--muted);font-size:.95rem}
.tagline b{color:var(--eco)}
details.level{border-top:1px solid var(--line);padding-top:8px}
details.level:first-child{border-top:0;padding-top:0}
details.level summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 8px;font:700 1rem var(--f-display)}
details.level summary::-webkit-details-marker{display:none}
details.level summary .ln{font:600 .8rem var(--f-mono);color:var(--chem)}
details.level summary .lcount{font:400 .8rem var(--f-mono);color:var(--muted)}
details.level[open] summary{margin-bottom:4px}
.levels{gap:8px}
.verdict{margin:10px 0 0;padding:8px 12px;border-radius:8px;font-weight:700}
.verdict.ok{background:var(--eco-soft);color:var(--good)}
.verdict.shown{background:var(--sunk);color:var(--muted);font-weight:400}
details.mb summary,details.more summary{cursor:pointer;font-size:.86rem;font-weight:700;color:var(--muted)}
details.mb[open] summary{margin-bottom:6px}
.fuels{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px;padding:14px;border:1px solid var(--line);border-radius:10px}
.frow2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 5.5em;gap:12px;align-items:center;font-size:.88rem;padding:8px 6px;border-radius:6px;border-top:1px solid var(--line)}
.fname{display:flex;flex-direction:column;gap:2px;min-width:0}
.fname > span:first-child{font-weight:700}
.feq{font-size:.92rem;line-height:1.7;overflow-x:auto}
.feq .st{display:none}.feq .co{font-weight:700;color:var(--chem)}.feq .arrow{color:var(--chem);margin:0 .25em}
.feq em{font-style:normal;color:var(--muted);font-size:.8rem}
.fdh{font-size:.78rem;color:var(--muted)}
.rxname{margin:0 0 6px;font-weight:700;color:var(--muted);font-size:.9rem}
.frow2 i{display:block;height:12px;width:var(--w);background:var(--in1);border-radius:3px;transition:width .2s}
.frow2 i.inf{background:repeating-linear-gradient(90deg,var(--want) 0 6px,transparent 6px 10px)}
.frow2 b{text-align:right;font-variant-numeric:tabular-nums}
.frow2.me{background:var(--amber-soft)}

<script>
/* ================================================================
   EcoChem engine — pure functions, no DOM.
   Reaction data model → stoichiometry solver → eco interpretation.
   ================================================================ */

const AR = {H:1,He:4,Li:7,Be:9,B:11,C:12,N:14,O:16,F:19,Ne:20,Na:23,Mg:24,Al:27,Si:28,P:31,S:32,Cl:35.5,Ar:40,K:39,Ca:40,Ti:48,Cr:52,Mn:55,Fe:56,Co:59,Ni:59,Cu:64,Zn:65,Br:80,Ag:108,Sn:119,I:127,Ba:137,Au:197,Hg:201,Pb:207};
const FARADAY = 96500, RGAS = 8.31, NA = 6.02e23;
const UNIT = { mass:{mg:1e-3,g:1,kg:1e3,t:1e6}, vol:{cm3:1e-3,dm3:1,m3:1e3}, time:{s:1,min:60,h:3600} };
const ULBL = {mg:'mg',g:'g',kg:'kg',t:'t',cm3:'cm³',dm3:'dm³',m3:'m³',s:'s',min:'min',h:'h',mol:'mol'};
const PATTERN = [
  ['question','Question'],['equation','Balanced equation'],['data','Relevant data'],['moles','Moles'],
  ['ratio','Mole ratio'],['required','Required quantity'],['answer','Answer'],['eco','Eco connection']
];

/* ---------- number formatting ---------- */
const SUPS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺'};
function group(s){ const [i,d] = s.split('.'); const neg = i.startsWith('-'); let ii = neg? i.slice(1):i; if(ii.length>=5) ii = ii.replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (neg?'-':'')+ii+(d!==undefined?'.'+d:''); }
function fmt(x, sf=3){
  if(x===null||x===undefined||!isFinite(x)) return '—';
  if(x===0) return '0';
  const a = Math.abs(x);
  if(a>=1e6 || a<1e-3){
    const [m,e] = x.toExponential(sf-1).split('e');
    return m+' × 10'+String(+e).split('').map(c=>SUPS[c]).join('');
  }
  let s = x.toPrecision(sf);
  if(s.includes('e')) s = String(Number(s));
  return group(s);
}
function fmtMr(M){ return Number.isInteger(M) ? String(M) : M.toFixed(1); }
function fm(g){ const a=Math.abs(g); if(a>=1e6) return fmt(g/1e6)+' t'; if(a>=1000) return fmt(g/1000)+' kg'; if(a>0 && a<1) return fmt(g*1000)+' mg'; return fmt(g)+' g'; }
function parseNum(raw){
  if(raw===null||raw===undefined) return NaN;
  let s = String(raw).trim();
  const back = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':''};
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, c=>back[c]).replace(/−/g,'-').replace(/\s/g,'').replace(/,/g,'.');
  s = s.replace(/[×xX*]10\^?(-?\d+)/,'e$1');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
  return Number(s);
}
function close(a,b,tol=0.02){ return Math.abs(a-b) <= tol*Math.abs(b) + 1e-15; }

/* ---------- formulae ---------- */
function parseGroup(s){
  let i = 0;
  const num = ()=>{ let m=''; while(i<s.length && /\d/.test(s[i])){ m+=s[i]; i++; } return m? +m : 1; };
  const grp = ()=>{
    const res = [];
    while(i<s.length){
      const ch = s[i];
      if(ch==='('){ i++; const inner = grp(); if(s[i]!==')') throw new Error('A bracket is not closed in "'+s+'".'); i++; const n = num(); inner.forEach(([e,k])=>res.push([e,k*n])); }
      else if(ch===')') return res;
      else if(/[A-Z]/.test(ch)){ let el=ch; i++; if(i<s.length && /[a-z]/.test(s[i])){ el+=s[i]; i++; } if(!(el in AR)) throw new Error('"'+el+'" is not an element in the data table.'); res.push([el,num()]); }
      else throw new Error('Unexpected "'+ch+'" in "'+s+'". Write formulae like H2SO4 or Ca(OH)2.');
    }
    return res;
  };
  const r = grp(); if(i<s.length) throw new Error('Unexpected ")" in "'+s+'".'); return r;
}
function parseFormula(str){
  const parts = String(str).split(/[.·•]/);
  const counts = {}, order = [];
  parts.forEach((part,pi)=>{
    let mult = 1, s = part;
    if(pi>0){ const m = s.match(/^(\d+)/); if(m){ mult=+m[1]; s=s.slice(m[1].length); } }
    if(!s) throw new Error('Empty formula.');
    parseGroup(s).forEach(([el,n])=>{ if(!(el in counts)){ counts[el]=0; order.push(el); } counts[el]+=n*mult; });
  });
  return {counts, order};
}
function mrOf(pf){ let M=0; for(const el in pf.counts) M += AR[el]*pf.counts[el]; return Math.round(M*10)/10; }
function fStr(f){ return String(f).replace(/\./g,'·').replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>'); }
function fH(sp){
  if(typeof sp==='string'){ if(sp==='e-') return 'e<sup>−</sup>'; const m = sp.match(/^(.*)\^(.*)$/); return m? fStr(m[1])+'<sup>'+m[2].replace('-','−')+'</sup>' : fStr(sp); }
  if(sp.e) return 'e<sup>−</sup>';
  return fStr(sp.f) + (sp.ch? '<sup>'+sp.ch.replace('-','−')+'</sup>' : '');
}
function mrLabel(sp){ const single = sp.order && sp.order.length===1 && sp.counts[sp.order[0]]===1; return (single?'A<sub>r</sub>':'M<sub>r</sub>')+'('+fH(sp)+')'; }
function mrBreak(sp){
  const single = sp.order.length===1 && sp.counts[sp.order[0]]===1;
  if(single) return fmtMr(sp.M);
  const parts = sp.order.map(el=>{ const n=sp.counts[el]; return n>1? `(${n} × ${AR[el]})` : `${AR[el]}`; });
  return parts.join(' + ') + ' = ' + fmtMr(sp.M);
}
function pctEl(sp, el){ return (sp.counts[el]||0)*AR[el]/sp.M*100; }
function sameCounts(a,b){ const ka=Object.keys(a), kb=Object.keys(b); return ka.length===kb.length && ka.every(k=>a[k]===b[k]); }
function chargeNum(ch){ if(!ch) return 0; const m = ch.match(/^(\d*)([+-])$/); if(!m) return 0; return (m[1]?+m[1]:1)*(m[2]==='+'?1:-1); }

/* ---------- reactions ---------- */
function parseSpecies(tok, side){
  let t = tok.trim(), state = '';
  const sm = t.match(/\((s|l|g|aq)\)$/); if(sm){ state = sm[1]; t = t.slice(0,-sm[0].length).trim(); }
  let coef = 1;
  const cm = t.match(/^(\d+)\s*/);
  if(cm && t.length>cm[0].length && /[A-Z(e]/.test(t[cm[0].length])){ coef = +cm[1]; t = t.slice(cm[0].length); }
  if(!t) throw new Error('A species is missing in the equation.');
  if(t==='e⁻' || t==='e') return {f:'e-', key:'e-', coef, state:'', ch:'-', e:true, side, M:null, counts:{}, order:[]};
  let ch = '';
  const chm = t.match(/\^(\d*)([⁺⁻])$/); if(chm){ ch = (chm[1]||'') + (chm[2]==='⁺'?'+':'-'); t = t.slice(0,-chm[0].length); }
  const pf = parseFormula(t);
  return {f:t, key: t+(ch?'^'+ch:''), coef, state, ch, e:false, side, counts:pf.counts, order:pf.order, M:mrOf(pf)};
}
function parseEquation(str){
  let s = String(str).trim();
  let rev = false;
  if(/<=>|⇌/.test(s)){ rev = true; s = s.replace(/<=>|⇌/,'→'); }
  s = s.replace(/-->|->|=>|=/,'→');
  const sides = s.split('→');
  if(sides.length!==2 || !sides[0].trim() || !sides[1].trim()) throw new Error('Write the equation with one arrow, for example: 2H2 + O2 -> 2H2O');
  const protect = x => x.replace(/\^(\d*)\+/g,'^$1⁺').replace(/\^(\d*)-/g,'^$1⁻').replace(/(^|[\s+\d])e-(?=\s|$|\+)/g,'$1e⁻');
  const species = [];
  ['r','p'].forEach((side,k)=>{
    protect(sides[k]).split('+').map(x=>x.trim()).filter(Boolean).forEach(tok=>species.push(parseSpecies(tok,side)));
  });
  return {species, rev};
}
function checkBalance(rx){
  const tally = side => { const t={}; let c=0; rx.species.filter(s=>s.side===side).forEach(s=>{ if(s.e){ c -= s.coef; return; } for(const el in s.counts) t[el]=(t[el]||0)+s.counts[el]*s.coef; c += chargeNum(s.ch)*s.coef; }); return {t,c}; };
  const L = tally('r'), P = tally('p');
  const els = [...new Set([...Object.keys(L.t),...Object.keys(P.t)])];
  const rows = els.map(el=>({el, l:L.t[el]||0, r:P.t[el]||0}));
  return {ok: rows.every(r=>r.l===r.r) && L.c===P.c, rows, lc:L.c, rc:P.c, charged: rx.species.some(s=>s.e||s.ch)};
}

const RX = {
  octane:     {name:'Burning octane (petrol)', cat:'Combustion', eq:'2C8H18(l) + 25O2(g) -> 16CO2(g) + 18H2O(l)', emit:['CO2'], eco:{type:'combustion', fuel:'C8H18'}},
  methane:    {name:'Burning methane (natural gas)', cat:'Combustion', eq:'CH4(g) + 2O2(g) -> CO2(g) + 2H2O(l)', emit:['CO2'], eco:{type:'combustion', fuel:'CH4'}},
  ethanolburn:{name:'Burning ethanol (biofuel)', cat:'Combustion', eq:'C2H5OH(l) + 3O2(g) -> 2CO2(g) + 3H2O(l)', emit:['CO2'], eco:{type:'combustion', fuel:'C2H5OH', bio:true}},
  propane:    {name:'Burning propane (LPG)', cat:'Combustion', eq:'C3H8(g) + 5O2(g) -> 3CO2(g) + 4H2O(l)', emit:['CO2'], eco:{type:'combustion', fuel:'C3H8'}},
  coal:       {name:'Burning coal (as carbon)', cat:'Combustion', eq:'C(s) + O2(g) -> CO2(g)', emit:['CO2'], eco:{type:'combustion', fuel:'C'}},

  hydrogen:   {name:'Burning hydrogen', cat:'Combustion', eq:'2H2(g) + O2(g) -> 2H2O(l)', eco:{type:'combustion', fuel:'H2'}},
  limestone:  {name:'Thermal decomposition of limestone', cat:'Thermal decomposition', eq:'CaCO3(s) -> CaO(s) + CO2(g)', desired:'CaO', emit:['CO2'], eco:{type:'thermal', gas:'CO2'}},
  cuco3:      {name:'Thermal decomposition of copper(II) carbonate', cat:'Thermal decomposition', eq:'CuCO3(s) -> CuO(s) + CO2(g)', desired:'CuO', emit:['CO2'], eco:{type:'thermal', gas:'CO2'}},
  haber:      {name:'Haber process (ammonia)', cat:'Industrial synthesis', eq:'N2(g) + 3H2(g) <=> 2NH3(g)', desired:'NH3', eco:{type:'atomEconomy'}},

  ferment:    {name:'Ethanol by fermentation', cat:'Industrial synthesis', eq:'C6H12O6(aq) -> 2C2H5OH(aq) + 2CO2(g)', desired:'C2H5OH', emit:['CO2'], eco:{type:'atomEconomy', compare:'hydration'}},
  hydration:  {name:'Ethanol by hydration of ethene', cat:'Industrial synthesis', eq:'C2H4(g) + H2O(g) -> C2H5OH(g)', desired:'C2H5OH', eco:{type:'atomEconomy', compare:'ferment'}},
  nh4no3:     {name:'Making ammonium nitrate', cat:'Fertiliser production', eq:'NH3(g) + HNO3(aq) -> NH4NO3(aq)', desired:'NH4NO3', eco:{type:'fertiliser'}},
  nh42so4:    {name:'Making ammonium sulfate', cat:'Fertiliser production', eq:'2NH3(g) + H2SO4(aq) -> (NH4)2SO4(aq)', desired:'(NH4)2SO4', eco:{type:'fertiliser'}},
  blast:      {name:'Blast furnace: reducing iron(III) oxide', cat:'Metal extraction', eq:'Fe2O3(s) + 3CO(g) -> 2Fe(l) + 3CO2(g)', desired:'Fe', emit:['CO2'], eco:{type:'extraction', compound:'Fe2O3', metal:'Fe', grade:60}},
  alumina:    {name:'Aluminium from aluminium oxide (overall)', cat:'Metal extraction', eq:'2Al2O3(l) -> 4Al(l) + 3O2(g)', desired:'Al', eco:{type:'extraction', compound:'Al2O3', metal:'Al', grade:50}},
  displace:   {name:'Recovering copper with scrap iron', cat:'Redox', eq:'Fe(s) + CuSO4(aq) -> FeSO4(aq) + Cu(s)', desired:'Cu', eco:{type:'recovery', metal:'Cu', sacrificial:'Fe', left:'FeSO4'}},

  elAl:       {name:'Electrolysis: aluminium at the cathode', cat:'Electrolysis', eq:'Al^3+(l) + 3e- -> Al(l)', desired:'Al', eco:{type:'electrolysis', voltage:4.5, product:'Al'}},
  elCu:       {name:'Electrolysis: refining copper', cat:'Electrolysis', eq:'Cu^2+(aq) + 2e- -> Cu(s)', desired:'Cu', eco:{type:'electrolysis', voltage:0.3, product:'Cu'}},
  elH2:       {name:'Electrolysis: hydrogen at the cathode', cat:'Electrolysis', eq:'2H^+(aq) + 2e- -> H2(g)', desired:'H2', eco:{type:'electrolysis', voltage:2.0, product:'H2'}},
  cuso4hyd:   {name:'Heating hydrated copper(II) sulfate', cat:'Hydrated salts', eq:'CuSO4.5H2O(s) -> CuSO4(s) + 5H2O(g)', desired:'CuSO4', eco:{type:'hydrate', hydrate:'CuSO4.5H2O'}},
  soda:       {name:'Heating washing soda', cat:'Hydrated salts', eq:'Na2CO3.10H2O(s) -> Na2CO3(s) + 10H2O(g)', desired:'Na2CO3', eco:{type:'hydrate', hydrate:'Na2CO3.10H2O'}},
  photo:      {name:'Photosynthesis', cat:'Biological', eq:'6CO2(g) + 6H2O(l) -> C6H12O6(aq) + 6O2(g)', desired:'C6H12O6', eco:{type:'carbonCapture'}},

const RX_CACHE = {};
function buildReaction(def, id){
  const {species, rev} = parseEquation(def.eq);
  return {id, name:def.name, cat:def.cat, rev, species, desired:def.desired||null, emit:def.emit||[], eco:def.eco||{type:'generic'}};
}
function getRx(id){ if(!RX_CACHE[id]) RX_CACHE[id] = buildReaction(RX[id], id); return RX_CACHE[id]; }
function findSp(rx, ref){ const k = rx.species.findIndex(s=>s.key===ref); return k>=0? k : rx.species.findIndex(s=>s.f===ref && !s.ch); }
function aeOf(rx, key){
  const d = rx.species[findSp(rx,key)]; if(!d || d.side!=='p') return null;
  const den = rx.species.filter(s=>s.side==='r' && !s.e).reduce((a,s)=>a+s.coef*s.M,0);
  return d.coef*d.M/den*100;
}

/* ---------- quantity helpers ---------- */
function qty(g){
  switch(g.kind){
    case 'mass': case 'volume': return `${fmt(g.value)} ${ULBL[g.unit]}`;
    case 'moles': return `${fmt(g.value)} mol`;
    case 'solution': return `${fmt(g.vol)} ${ULBL[g.volUnit]} of ${fmt(g.conc)} mol/dm³`;
    case 'charge': return `${fmt(g.I)} A for ${fmt(g.t)} ${ULBL[g.tUnit]}`;
    case 'particles': return `${fmt(g.value)} particles`;
  }
  return '';
}
function condInfo(cond){
  cond = cond||{type:'rtp'};
  if(cond.type==='stp') return {Vm:22.4, line:'1 mol of any gas occupies 22.4 dm³ at s.t.p. (0 °C, 101 kPa)', short:'s.t.p.'};
  if(cond.type==='custom') return {Vm:null, T:+cond.T, p:+cond.p, line:`Ideal gas equation pV = nRT, with R = 8.31 J/(mol·K), T = ${fmt(+cond.T)} K, p = ${fmt(+cond.p)} kPa (p in kPa × V in dm³ gives joules)`, short:`${fmt(+cond.T)} K and ${fmt(+cond.p)} kPa`};
  return {Vm:24, line:'1 mol of any gas occupies 24 dm³ at r.t.p. (room temperature and pressure)', short:'r.t.p.'};
}

/* given amount → moles, with working lines */
function toMoles(sp, g, cond, purity){
  const L = [], wrong = []; let n, tip, guide;
  const nm = fH(sp);
  if(g.kind==='mass'){
    let m = g.value*UNIT.mass[g.unit];
    if(g.unit!=='g'){ L.push(`m = ${fmt(g.value)} ${ULBL[g.unit]} = ${fmt(m)} g`); wrong.push({v:g.value*(purity?purity/100:1)/sp.M, m:`Convert ${ULBL[g.unit]} to grams before dividing by M<sub>r</sub>.`}); }
    if(purity){ const mp = m*purity/100; L.push(`Mass of pure ${nm} = ${purity}% × ${fmt(m)} g = ${fmt(mp)} g`); wrong.push({v:m/sp.M, m:'Only part of the sample is the pure substance. Multiply by the purity first.'}); m = mp; }
    n = m/sp.M;
    L.push(`n(${nm}) = mass ÷ ${sp.order.length===1&&sp.counts[sp.order[0]]===1?'A<sub>r</sub>':'M<sub>r</sub>'} = ${fmt(m)} ÷ ${fmtMr(sp.M)} = <b>${fmt(n)} mol</b>`);
    wrong.push({v:m*sp.M, m:'You multiplied. Moles = mass ÷ M<sub>r</sub>.'});
    tip = 'n = mass in grams ÷ M<sub>r</sub>';
    guide = `n(${nm}) = mass in g ÷ ${fmtMr(sp.M)}` + (g.unit!=='g'? ` &nbsp;(first convert ${fmt(g.value)} ${ULBL[g.unit]} to grams)`:'') + (purity? ` &nbsp;(use only the ${purity}% that is pure)`:'');
  } else if(g.kind==='volume'){
    const V = g.value*UNIT.vol[g.unit];
    if(g.unit!=='dm3'){ L.push(`V = ${fmt(g.value)} ${ULBL[g.unit]} = ${fmt(V)} dm³`); }
    const c = condInfo(cond);
    if(c.Vm){
      n = V/c.Vm; L.push(`n(${nm}) = V ÷ ${c.Vm} = ${fmt(V)} ÷ ${c.Vm} = <b>${fmt(n)} mol</b>`);
      if(g.unit!=='dm3') wrong.push({v:g.value/c.Vm, m:`Convert ${ULBL[g.unit]} to dm³ first (${g.unit==='cm3'?'divide by 1000':'multiply by 1000'}).`});
      wrong.push({v:V*c.Vm, m:`Divide the volume by ${c.Vm}, do not multiply.`});
      tip = `n = volume in dm³ ÷ ${c.Vm}`; guide = `n(${nm}) = volume in dm³ ÷ ${c.Vm}` + (g.unit!=='dm3'? ` &nbsp;(convert ${fmt(g.value)} ${ULBL[g.unit]} to dm³)`:'');
    } else {
      n = c.p*V/(RGAS*c.T); L.push(`n(${nm}) = pV ÷ RT = (${fmt(c.p)} × ${fmt(V)}) ÷ (8.31 × ${fmt(c.T)}) = <b>${fmt(n)} mol</b>`);
      tip = 'n = pV ÷ RT (p in kPa, V in dm³)'; guide = `n(${nm}) = (${fmt(c.p)} × ${fmt(V)}) ÷ (8.31 × ${fmt(c.T)})`;
    }
  } else if(g.kind==='solution'){
    const V = g.vol*UNIT.vol[g.volUnit];
    if(g.volUnit!=='dm3'){ L.push(`V = ${fmt(g.vol)} ${ULBL[g.volUnit]} = ${fmt(V)} dm³`); wrong.push({v:g.conc*g.vol, m:`Convert ${ULBL[g.volUnit]} to dm³ first (divide cm³ by 1000).`}); }
    n = g.conc*V; L.push(`n(${nm}) = c × V = ${fmt(g.conc)} × ${fmt(V)} = <b>${fmt(n)} mol</b>`);
    wrong.push({v:g.conc/V, m:'Moles = concentration × volume (multiply).'});
    tip = 'n = concentration (mol/dm³) × volume (dm³)'; guide = `n(${nm}) = ${fmt(g.conc)} mol/dm³ × volume in dm³` + (g.volUnit!=='dm3'? ` &nbsp;(${fmt(g.vol)} cm³ ÷ 1000)`:'');
  } else if(g.kind==='moles'){
    n = g.value; L.push(`n(${nm}) = <b>${fmt(n)} mol</b> (given)`); tip = 'Already in moles.'; guide = 'The amount is already given in moles.';
  } else if(g.kind==='particles'){
    n = g.value/NA; L.push(`n(${nm}) = N ÷ 6.02 × 10²³ = <b>${fmt(n)} mol</b>`); tip = 'n = number of particles ÷ 6.02 × 10²³'; guide = tip;
  } else if(g.kind==='charge'){
    const ts = g.t*UNIT.time[g.tUnit];
    if(g.tUnit!=='s') L.push(`t = ${fmt(g.t)} ${ULBL[g.tUnit]} = ${fmt(ts)} s`);
    const Q = g.I*ts;
    L.push(`Q = I × t = ${fmt(g.I)} A × ${fmt(ts)} s = ${fmt(Q)} C`);
    n = Q/FARADAY; L.push(`n(e<sup>−</sup>) = Q ÷ F = ${fmt(Q)} ÷ 96 500 = <b>${fmt(n)} mol</b>`);
    if(g.tUnit!=='s') wrong.push({v:g.I*g.t/FARADAY, m:'Time must be in seconds before you calculate Q = I × t.'});
    wrong.push({v:Q, m:'That is the charge Q in coulombs. Divide by the Faraday constant to get moles of electrons.'});
    tip = 'Q = I × t (t in seconds), then n(e<sup>−</sup>) = Q ÷ 96 500'; guide = `Q = ${fmt(g.I)} A × time in seconds; then n(e<sup>−</sup>) = Q ÷ 96 500`;
  } else throw new Error('Unknown amount type.');
  return {n, lines:L, tip, guide, wrong};
}

/* moles → required quantity */
function fromMoles(sp, n, t, cond){
  const L = [], wrong = []; let value, unit, tip, guide, label;
  const nm = fH(sp);
  switch(t.kind){
    case 'moles': value=n; unit='mol'; label=`n(${nm})`; L.push(`n(${nm}) = <b>${fmt(n)} mol</b>`); tip='Already in moles.'; guide=tip; break;
    case 'mass': {
      const m = n*sp.M; unit = t.unit; value = m/UNIT.mass[unit]; label = `Mass of ${nm}`;
      L.push(`m = n × M<sub>r</sub> = ${fmt(n)} × ${fmtMr(sp.M)} = ${fmt(m)} g`);
      if(unit!=='g'){ L.push(`${fmt(m)} g = <b>${fmt(value)} ${ULBL[unit]}</b>`); wrong.push({v:m, m:`That is in grams. The question asks for ${ULBL[unit]}.`}); }
      wrong.push({v:n/sp.M/UNIT.mass[unit], m:'Mass = moles × M<sub>r</sub> (multiply, not divide).'});
      tip = 'mass = n × M<sub>r</sub>'; guide = `mass = ${fmt(n)} mol × ${fmtMr(sp.M)}` + (unit!=='g'? `, then convert grams to ${ULBL[unit]}`:''); break; }
    case 'volume': {
      const c = condInfo(cond); let V;
      if(c.Vm){ V = n*c.Vm; L.push(`V = n × ${c.Vm} = ${fmt(n)} × ${c.Vm} = ${fmt(V)} dm³`); tip=`volume (dm³) = n × ${c.Vm}`; guide=`V = ${fmt(n)} mol × ${c.Vm} dm³/mol`; wrong.push({v:n/c.Vm/UNIT.vol[t.unit], m:`Multiply by ${c.Vm}, do not divide.`}); }
      else { V = n*RGAS*c.T/c.p; L.push(`V = nRT ÷ p = (${fmt(n)} × 8.31 × ${fmt(c.T)}) ÷ ${fmt(c.p)} = ${fmt(V)} dm³`); tip='V = nRT ÷ p (p in kPa gives dm³)'; guide=`V = (${fmt(n)} × 8.31 × ${fmt(c.T)}) ÷ ${fmt(c.p)}`; wrong.push({v:n*24/UNIT.vol[t.unit], m:'24 dm³/mol only applies at room temperature. Use pV = nRT at these conditions.'}); }
      unit = t.unit; value = V/UNIT.vol[unit]; label = `Volume of ${nm}`;
      if(unit!=='dm3'){ L.push(`${fmt(V)} dm³ = <b>${fmt(value)} ${ULBL[unit]}</b>`); wrong.push({v:V, m:`That is in dm³. Convert to ${ULBL[unit]}.`}); guide += `, then convert to ${ULBL[unit]}`; }
      else L[L.length-1] = L[L.length-1].replace(`${fmt(V)} dm³`, `<b>${fmt(V)} dm³</b>`);
      break; }
    case 'solutionVolume': {
      const V = n/t.conc; unit = t.unit; value = V/UNIT.vol[unit]; label = `Volume of ${fmt(t.conc)} mol/dm³ ${nm}`;
      L.push(`V = n ÷ c = ${fmt(n)} ÷ ${fmt(t.conc)} = ${fmt(V)} dm³`);
      if(unit!=='dm3'){ L.push(`${fmt(V)} dm³ = <b>${fmt(value)} ${ULBL[unit]}</b>`); wrong.push({v:V, m:'That is in dm³. Multiply by 1000 to get cm³.'}); }
      wrong.push({v:n*t.conc/UNIT.vol[unit], m:'Volume = moles ÷ concentration.'});
      tip = 'volume (dm³) = n ÷ concentration'; guide = `V = ${fmt(n)} mol ÷ ${fmt(t.conc)} mol/dm³` + (unit!=='dm3'? ', then convert dm³ to cm³':''); break; }
    case 'concentration': {
      const V = t.vol*UNIT.vol[t.volUnit]; value = n/V; unit = 'mol/dm³'; label = `Concentration of ${nm}`;
      if(t.volUnit!=='dm3'){ L.push(`V = ${fmt(t.vol)} ${ULBL[t.volUnit]} = ${fmt(V)} dm³`); wrong.push({v:n/t.vol, m:'Convert the volume to dm³ before dividing.'}); }
      L.push(`c = n ÷ V = ${fmt(n)} ÷ ${fmt(V)} = <b>${fmt(value)} mol/dm³</b>`);
      wrong.push({v:n*V, m:'Concentration = moles ÷ volume (divide).'});
      tip = 'concentration = n ÷ volume in dm³'; guide = `c = ${fmt(n)} mol ÷ volume in dm³` + (t.volUnit!=='dm3'? ` (${fmt(t.vol)} cm³ ÷ 1000)`:''); break; }
    case 'particles': { value = n*NA; unit = 'particles'; label = `Number of ${nm} particles`; L.push(`N = n × 6.02 × 10²³ = <b>${fmt(value)}</b>`); tip='N = n × 6.02 × 10²³'; guide=tip; break; }
    case 'charge': { value = n*FARADAY; unit='C'; label='Charge needed'; L.push(`Q = n(e<sup>−</sup>) × F = ${fmt(n)} × 96 500 = <b>${fmt(value)} C</b>`); tip='Q = n(e<sup>−</sup>) × 96 500'; guide=tip; break; }
    case 'time': { const Q = n*FARADAY; const ts = Q/t.I; unit = t.unit; value = ts/UNIT.time[unit]; label='Time needed';
      L.push(`Q = n(e<sup>−</sup>) × F = ${fmt(n)} × 96 500 = ${fmt(Q)} C`); L.push(`t = Q ÷ I = ${fmt(Q)} ÷ ${fmt(t.I)} = ${fmt(ts)} s`);
      if(unit!=='s') L.push(`${fmt(ts)} s = <b>${fmt(value)} ${ULBL[unit]}</b>`); else L[L.length-1]=L[L.length-1].replace(`${fmt(ts)} s`,`<b>${fmt(ts)} s</b>`);
      tip='Q = n(e<sup>−</sup>) × 96 500, then t = Q ÷ I'; guide=tip; break; }
    default: throw new Error('Unknown target type.');
  }
  return {value, unit, label, lines:L, tip, guide, wrong};
}

/* ---------- reacting-quantities solver (the universal pattern) ---------- */
function eqHTML(rx){
  const side = s => rx.species.filter(x=>x.side===s).map(x=>`<span class="sp">${x.coef>1?`<span class="co">${x.coef}</span>`:''}${fH(x)}${x.state?`<span class="st">(${x.state})</span>`:''}</span>`).join(' <span class="op">+</span> ');
  return `${side('r')} <span class="arrow">${rx.rev?'⇌':'→'}</span> ${side('p')}`;
}
function balanceNote(bal){
  const atoms = bal.rows.map(r=>`${r.el} ${r.l}`).join(' · ');
  if(bal.ok) return `<p class="note">Check the balance: ${atoms} on each side${bal.charged?`; total charge ${bal.lc} on each side`:''}. ✓</p>`;
  const bad = bal.rows.filter(r=>r.l!==r.r).map(r=>`${r.el}: ${r.l} on the left, ${r.r} on the right`);
  if(bal.lc!==bal.rc) bad.push(`charge: ${bal.lc} on the left, ${bal.rc} on the right`);
  return `<p class="note bad">Not balanced: ${bad.join('; ')}.</p>`;
}
const KIND_WORD = {mass:'mass', volume:'gas volume', solution:'solution', moles:'amount', charge:'charge'};

function solveReacting(p, rx){
  const S = rx.species, steps = [];
  const cond = p.cond || {type:'rtp'};
  const G = p.givens.map(g=>({...g, i:findSp(rx,g.sp)}));
  const t = {...p.target, i:findSp(rx,p.target.sp)};
  G.forEach(g=>{ if(g.i<0) throw new Error(`${g.sp} is not in this equation.`); });
  if(t.i<0) throw new Error(`${p.target.sp} is not in this equation.`);
  const tsp = S[t.i];
  if(!rx.single){ const bal = checkBalance(rx); if(!bal.ok) throw new Error('The equation is not balanced. '+balanceNote(bal).replace(/<[^>]+>/g,'')); }
  for(const g of G){ const s=S[g.i];
    if(g.kind==='charge' && !s.e) throw new Error('Current and time can only be given for electrons (e−) in a half-equation.');
    if(s.e && g.kind!=='charge') throw new Error('For electrons, give a current and time.');
    if(['mass','volume','moles','particles'].includes(g.kind) && !(g.value>0)) throw new Error('Enter a positive amount for '+s.f+'.');
    if(g.kind==='solution' && !(g.conc>0 && g.vol>0)) throw new Error('Enter a positive concentration and volume.');
    if(g.kind==='charge' && !(g.I>0 && g.t>0)) throw new Error('Enter a positive current and time.');
  }
  if(G.length===2){
    if(G[0].i===G[1].i) throw new Error('Choose two different reactants.');
    if(G.some(g=>S[g.i].side!=='r')) throw new Error('For a limiting-reactant problem both given substances must be reactants.');
  }
  if(t.kind==='purity' && G.some(g=>g.i===t.i)) throw new Error('For percentage purity, give the amount of a different substance (for example the CO₂ or other product formed), not the impure substance itself.');
  if(t.kind==='percentYield' && tsp.side!=='p') throw new Error('Percentage yield is calculated for a product.');
  if(tsp.e && !['charge','time'].includes(t.kind)) throw new Error('For electrons, ask for charge or time.');
  if(['charge','time'].includes(t.kind) && !tsp.e) throw new Error('Charge and time only apply to electrons (e−).');
  const gas = G.some(g=>g.kind==='volume') || t.kind==='volume';

  // 1 Question
  steps.push({id:'question', body:`<p class="qtext">${p.qText}</p>`});
  // 2 Equation
  if(rx.single) steps.push({id:'equation', skipped:true, body:'<p>Only one substance is involved, so no equation is needed.</p>'});
  else steps.push({id:'equation', body:`${rx.name?`<p class="rxname">${rx.name}</p>`:''}<div class="eq">${eqHTML(rx)}</div>${balanceNote(checkBalance(rx))}`});
  // 3 Data
  const dl = []; const seen = new Set();
  const needM = i => G.some(g=>g.i===i && g.kind==='mass') || (i===t.i && ['mass','percentYield','purity'].includes(t.kind));
  [...G.map(g=>g.i), t.i].forEach(i=>{ if(seen.has(i)) return; seen.add(i); const s=S[i];
    if(s.e) dl.push('Faraday constant: F = 96 500 C per mole of electrons');
    else if(needM(i)) dl.push(`${mrLabel(s)} = ${mrBreak(s)}`);
  });
  G.forEach(g=>dl.push(`Given: ${KIND_WORD[g.kind]||'amount'} of ${fH(S[g.i])} = ${qty(g)}`));
  if(p.purity) dl.push(`Purity of ${fH(S[G[0].i])} = ${p.purity}%`);
  if(t.kind==='concentration') dl.push(`Volume of ${fH(tsp)} solution = ${fmt(t.vol)} ${ULBL[t.volUnit]}`);
  if(t.kind==='solutionVolume') dl.push(`Concentration of ${fH(tsp)} solution = ${fmt(t.conc)} mol/dm³`);
  if(t.kind==='time') dl.push(`Current = ${fmt(t.I)} A`);
  if(t.kind==='percentYield') dl.push(`Actual mass of ${fH(tsp)} collected = ${fmt(t.actual)} ${ULBL[t.actualUnit]}`);
  if(t.kind==='purity') dl.push(`Mass of impure sample = ${fmt(t.sample)} ${ULBL[t.sampleUnit]}`);
  if(p.yield) dl.push(`Percentage yield = ${p.yield}%`);
  if(gas) dl.push(condInfo(cond).line);
  steps.push({id:'data', body:lines(dl)});

  // 4 Moles
  const ml = [], mchecks = [];
  G.forEach((g,k)=>{ const r = toMoles(S[g.i], g, cond, k===0? p.purity : null); g.n = r.n; if(G.length>1) ml.push(`<span class="sub">${fH(S[g.i])}</span>`); ml.push(...r.lines);
    mchecks.push({label:`n(${fH(S[g.i])})`, answer:r.n, unit:'mol', tip:r.tip, guide:r.guide, wrong:r.wrong}); });
  steps.push({id:'moles', ask: G.length>1? 'Convert both given amounts into moles.' : 'Convert the given amount into moles.', body:lines(ml), checks:mchecks});

  // 5 Ratio
  let xi, lim=null, ex=null;
  const nTof = x => x*tsp.coef;
  if(G.length===1){
    const g = G[0], sg = S[g.i]; xi = g.n/sg.coef;
    if(g.i===t.i){
      steps.push({id:'ratio', skipped:true, body:`<p>The answer is about the same substance, ${fH(tsp)}, so there is no ratio to apply.</p>`});
    } else {
      const nT = nTof(xi);
      const frac = tsp.coef===sg.coef? '1' : `${tsp.coef}/${sg.coef}`;
      const rl = [`From the equation: <b>${sg.coef} ${fH(sg)} : ${tsp.coef} ${fH(tsp)}</b>`,
        `n(${fH(tsp)}) = n(${fH(sg)}) × ${frac} = ${fmt(g.n)} × ${frac} = <b>${fmt(nT)} mol</b>`];
      const wrong = [];
      if(tsp.coef!==sg.coef){ wrong.push({v:g.n, m:'That is the number of moles you started with. Apply the mole ratio from the equation.'}); wrong.push({v:g.n*sg.coef/tsp.coef, m:`The ratio is upside down. Multiply by ${tsp.coef} ÷ ${sg.coef}.`}); }
      steps.push({id:'ratio', ask:'Use the coefficients in the balanced equation to find moles of the substance you want.', body:lines(rl),
        checks:[{label:`n(${fH(tsp)})`, answer:nT, unit:'mol', tip:'n(wanted) = n(given) × (coefficient of wanted ÷ coefficient of given)', guide:`Equation ratio ${sg.coef} ${fH(sg)} : ${tsp.coef} ${fH(tsp)}, so multiply n(${fH(sg)}) by ${tsp.coef} ÷ ${sg.coef}`, wrong}]});
    }
  } else {
    const rl = ['Divide each amount by its coefficient in the equation. The smaller result belongs to the limiting reactant.'];
    G.forEach(g=>{ const s=S[g.i]; g.r = g.n/s.coef; rl.push(`${fH(s)}: ${fmt(g.n)} ÷ ${s.coef} = ${fmt(g.r)}`); });
    lim = G[0].r <= G[1].r ? G[0] : G[1]; ex = lim===G[0]? G[1] : G[0];
    xi = lim.r;
    rl.push(`<b>${fH(S[lim.i])} is the limiting reactant</b>; ${fH(S[ex.i])} is in excess.`);
    const nT = nTof(xi);
    const sl = S[lim.i];
    const frac = tsp.coef===sl.coef? '1' : `${tsp.coef}/${sl.coef}`;
    rl.push(`n(${fH(tsp)}) = n(${fH(sl)}) × ${frac} = ${fmt(lim.n)} × ${frac} = <b>${fmt(nT)} mol</b>`);
    steps.push({id:'ratio', ask:'Decide which reactant runs out first, then use it with the mole ratio.', body:lines(rl), checks:[
      {type:'choice', label:'Limiting reactant', options:G.map(g=>({v:String(g.i), html:fH(S[g.i])})), answer:String(lim.i), tip:'Divide each number of moles by its coefficient. The smaller value runs out first.', guide:`Compare n ÷ coefficient: ${G.map(g=>`${fH(S[g.i])} ${fmt(g.n)} ÷ ${S[g.i].coef}`).join(' vs ')}`, wrongMsg:'That reactant is in excess. Divide each amount by its coefficient and pick the smaller.'},
      {label:`n(${fH(tsp)})`, answer:nT, unit:'mol', tip:'Only the limiting reactant decides how much forms.', guide:`n(${fH(tsp)}) = n(limiting) × (coefficient of ${fH(tsp)} ÷ coefficient of limiting)`,
        wrong:[{v:ex.r*tsp.coef, m:'You used the reactant in excess. The limiting reactant decides how much forms.'}]}]});
  }

  // 6 Required
  const nT = nTof(xi);
  let fin, rl = [], extra = [];
  if(t.kind==='percentYield'){
    const theo = nT*tsp.M, act = t.actual*UNIT.mass[t.actualUnit];
    rl.push(`Theoretical mass = n × M<sub>r</sub> = ${fmt(nT)} × ${fmtMr(tsp.M)} = ${fmt(theo)} g`);
    if(t.actualUnit!=='g') rl.push(`Actual mass = ${fmt(t.actual)} ${ULBL[t.actualUnit]} = ${fmt(act)} g`);
    const pct = act/theo*100;
    rl.push(`% yield = actual ÷ theoretical × 100 = ${fmt(act)} ÷ ${fmt(theo)} × 100 = <b>${fmt(pct)}%</b>`);
    fin = {value:pct, unit:'%', label:'Percentage yield', tip:'% yield = actual mass ÷ theoretical mass × 100', guide:`First find the theoretical mass (n × ${fmtMr(tsp.M)}), then actual ÷ theoretical × 100`,
      wrong:[{v:theo/act*100, m:'Upside down: divide actual by theoretical.'},{v:theo/UNIT.mass[t.actualUnit], m:'That is the theoretical mass. Now compare the actual mass with it as a percentage.'}], theo, act};
  } else if(t.kind==='purity'){
    const pure = nT*tsp.M, samp = t.sample*UNIT.mass[t.sampleUnit];
    rl.push(`Mass of pure ${fH(tsp)} = n × M<sub>r</sub> = ${fmt(nT)} × ${fmtMr(tsp.M)} = ${fmt(pure)} g`);
    if(t.sampleUnit!=='g') rl.push(`Sample mass = ${fmt(t.sample)} ${ULBL[t.sampleUnit]} = ${fmt(samp)} g`);
    const pct = pure/samp*100;
    rl.push(`% purity = pure mass ÷ sample mass × 100 = ${fmt(pure)} ÷ ${fmt(samp)} × 100 = <b>${fmt(pct)}%</b>`);
    fin = {value:pct, unit:'%', label:`Percentage purity of ${fH(tsp)}`, tip:'% purity = mass of pure substance ÷ mass of sample × 100', guide:`Mass of pure ${fH(tsp)} = n × ${fmtMr(tsp.M)}; then ÷ ${fmt(samp)} g × 100`,
      wrong:[{v:samp/pure*100, m:'Upside down: divide the pure mass by the sample mass.'},{v:pure, m:'That is the mass of pure substance. Now turn it into a percentage of the sample.'}]};
  } else {
    const r = fromMoles(tsp, nT, t, cond);
    rl.push(...r.lines);
    fin = {value:r.value, unit:r.unit, label:r.label, tip:r.tip, guide:r.guide, wrong:r.wrong};
    if(p.yield && ['mass','volume','moles'].includes(t.kind)){
      const act = r.value*p.yield/100;
      rl[rl.length-1] = rl[rl.length-1].replace(/<\/?b>/g,'');
      rl.push(`Actual = theoretical × ${p.yield}% = ${fmt(r.value)} × ${p.yield/100} = <b>${fmt(act)} ${ULBL[r.unit]||r.unit}</b>`);
      fin.wrong = [...fin.wrong, {v:r.value, m:`That is the theoretical amount. Only ${p.yield}% is actually obtained.`}];
      fin.tip += `; then × ${p.yield}% yield`; fin.guide += `; then multiply by ${p.yield/100}`;
      fin.theo = r.value; fin.value = act; fin.label = 'Actual '+r.label.charAt(0).toLowerCase()+r.label.slice(1);
    }
  }
  let excess = null;
  if(ex){
    const s = S[ex.i]; const used = xi*s.coef, left = ex.n-used;
    excess = {i:ex.i, n:left, g: s.M? left*s.M : null};
    extra.push(`Excess ${fH(s)} left over = ${fmt(ex.n)} − (${s.coef} × ${fmt(xi)}) = ${fmt(left)} mol${s.M? ` = ${fm(left*s.M)}`:''}`);
  }
  const unitTxt = ULBL[fin.unit]||fin.unit;
  steps.push({id:'required', ask:`Turn moles of ${fH(tsp)} into the quantity the question asks for.`, body:lines(rl)+(extra.length? lines(extra,'muted'):''),
    checks:[{label:fin.label, answer:fin.value, unit:unitTxt, tip:fin.tip, guide:fin.guide, wrong:fin.wrong, final:true}]});
  // 7 Answer
  steps.push({id:'answer', body:answerBox(fin.label, fin.value, unitTxt) + (excess? `<p class="note">${fH(S[ex.i])} was in excess: ${fmt(excess.n)} mol${excess.g?` (${fm(excess.g)})`:''} is left unreacted.</p>`:'')});

  // 8 Eco
  const masses = rx.single? null : S.map(s=> s.e? null : s.coef*xi*s.M);
  const ctx = {rx, p, xi, masses, excess, t, tsp, fin, G, cond, eco: p.eco || rx.eco, unitTxt};
  steps.push({id:'eco', body:ecoBody(ctx)});
  return {steps, final:fin};
}

/* ---------- atom economy ---------- */
function solveAE(p, rx){
  const S = rx.species; const d = S[findSp(rx, p.desired || rx.desired)];
  if(!d || d.side!=='p') throw new Error('Choose a product as the useful (desired) product.');
  const bal = checkBalance(rx); if(!bal.ok) throw new Error('The equation is not balanced.');
  const steps = [];
  steps.push({id:'question', body:`<p class="qtext">${p.qText}</p>`});
  steps.push({id:'equation', body:`<p class="rxname">${rx.name}</p><div class="eq">${eqHTML(rx)}</div>${balanceNote(bal)}<p class="note">Atom economy only needs the balanced equation. No measured masses are used.</p>`});
  const dl = S.filter(s=>!s.e).map(s=>`${mrLabel(s)} = ${mrBreak(s)}`);
  dl.push(`Useful product: ${fH(d)}`);
  steps.push({id:'data', body:lines(dl)});
  const reacts = S.filter(s=>s.side==='r' && !s.e);
  const tot = reacts.reduce((a,s)=>a+s.coef*s.M,0);
  const ml = reacts.map(s=>`${fH(s)}: ${s.coef} × ${fmtMr(s.M)} = ${fmt(s.coef*s.M,4)}`);
  ml.push(`Total mass of reactants = <b>${fmt(tot,4)}</b>`);
  steps.push({id:'moles', title:'Masses from the equation', ask:'Multiply each reactant\'s M<sub>r</sub> by its coefficient and add them up.', body:lines(ml),
    checks:[{label:'Total mass of reactants', answer:tot, unit:'', tip:'Total = Σ (coefficient × M<sub>r</sub>) for all reactants', guide:reacts.map(s=>`${s.coef} × ${fmtMr(s.M)}`).join(' + '), wrong:[{v:reacts.reduce((a,s)=>a+s.M,0), m:'Multiply each M<sub>r</sub> by its coefficient in the equation.'}]}]});
  const dm = d.coef*d.M;
  steps.push({id:'ratio', title:'Useful fraction', body:lines([`Mass of useful product in the equation = ${d.coef} × ${fmtMr(d.M)} = ${fmt(dm,4)}`, `Fraction = ${fmt(dm,4)} ÷ ${fmt(tot,4)}`])});
  const ae = dm/tot*100;
  steps.push({id:'required', ask:'Work out the atom economy as a percentage.', body:lines([`Atom economy = mass of useful product ÷ total mass of reactants × 100`, `= ${fmt(dm,4)} ÷ ${fmt(tot,4)} × 100 = <b>${fmt(ae)}%</b>`]),
    checks:[{label:'Atom economy', answer:ae, unit:'%', tip:'Atom economy = (coefficient × M<sub>r</sub> of useful product) ÷ total reactant mass × 100', guide:`${d.coef} × ${fmtMr(d.M)} ÷ ${fmt(tot,4)} × 100`, wrong:[{v:d.M/tot*100, m:'Include the coefficient of the useful product.'},{v:tot/dm*100, m:'Upside down: useful product ÷ total reactants.'}], final:true}]});
  steps.push({id:'answer', body:answerBox(`Atom economy for ${fH(d)}`, ae, '%')});
  const masses = S.map(s=> s.e? null : s.coef*s.M);
  const ctx = {rx, p, xi:1, masses, perEquation:true, tsp:d, fin:{value:ae, unit:'%'}, eco:{...(rx.eco||{}), type:'atomEconomy'}, unitTxt:'%'};
  steps.push({id:'eco', body:ecoBody(ctx)});
  return {steps, final:{value:ae, unit:'%'}};
}

/* ---------- empirical & molecular formula ---------- */
function toFormula(pairs){ return pairs.map(([el,n])=>el+(n>1?n:'')).join(''); }
function solveEmpirical(p){
  const rows = p.data.filter(r=>r[0] && +r[1]>0).map(r=>[r[0], +r[1]]);
  if(rows.length<2) throw new Error('Enter at least two elements with their percentages or masses.');
  rows.forEach(([el])=>{ if(!(el in AR)) throw new Error(`"${el}" is not an element in the data table.`); });
  const steps = []; const unit = p.mode==='mass'? 'g' : '%';
  steps.push({id:'question', body:`<p class="qtext">${p.qText}</p>`});
  steps.push({id:'equation', skipped:true, body:'<p>No equation here. You are working out a formula from composition data, but the method still goes through moles and a ratio.</p>'});
  steps.push({id:'data', body:lines([...rows.map(([el,v])=>`${el}: ${fmt(v)} ${unit}, A<sub>r</sub> = ${AR[el]}`), ...(p.mode==='percent'?['Treat percentages as the mass in grams of a 100 g sample.']:[]), ...(p.Mr? [`M<sub>r</sub> of the compound = ${fmt(+p.Mr)}`]:[])])});
  const n = rows.map(([el,v])=>v/AR[el]);
  steps.push({id:'moles', ask:'Divide each mass (or percentage) by the element\'s A<sub>r</sub>.', body:lines(rows.map(([el,v],k)=>`n(${el}) = ${fmt(v)} ÷ ${AR[el]} = <b>${fmt(n[k])}</b>`)),
    checks: rows.map(([el,v],k)=>({label:`n(${el})`, answer:n[k], unit:'mol', tip:'n = mass ÷ A<sub>r</sub>', guide:`n(${el}) = ${fmt(v)} ÷ ${AR[el]}`, wrong:[{v:v*AR[el], m:'Divide by A<sub>r</sub>, do not multiply.'}]}))});
  const min = Math.min(...n); const r = n.map(x=>x/min);
  let mult = 1; for(const m of [1,2,3,4,5,6]){ if(r.every(x=>Math.abs(x*m-Math.round(x*m))<0.1)){ mult=m; break; } }
  const whole = r.map(x=>Math.round(x*mult));
  const pairs = rows.map(([el],k)=>[el, whole[k]]);
  const ef = toFormula(pairs); const efc = parseFormula(ef).counts;
  const rl = [`Divide by the smallest (${fmt(min)}): ${rows.map(([el],k)=>`${el} ${fmt(r[k])}`).join(' : ')}`];
  if(mult>1) rl.push(`Not all whole numbers, so multiply by ${mult}: ${rows.map(([el],k)=>`${el} ${fmt(r[k]*mult)}`).join(' : ')}`);
  rl.push(`Simplest whole-number ratio = <b>${whole.join(' : ')}</b> → empirical formula <b>${fStr(ef)}</b>`);
  steps.push({id:'ratio', title:'Simplest ratio', ask:'Divide every amount by the smallest, then round to whole numbers.', body:lines(rl),
    checks:[{type:'formula', label:'Empirical formula', counts:efc, answerText:ef, tip:'Divide all mole values by the smallest one. If you get .5 or .33, multiply everything by 2 or 3.', guide:`Divide each value by ${fmt(min)}`}]});
  let finalF = ef, req = [], checks = [];
  if(p.Mr){
    const em = mrOf(parseFormula(ef)); const k = Math.round(+p.Mr/em);
    finalF = toFormula(pairs.map(([el,c])=>[el,c*k]));
    req = [`Mass of one empirical unit ${fStr(ef)} = ${fmt(em,4)}`, `Number of units = M<sub>r</sub> ÷ empirical mass = ${fmt(+p.Mr)} ÷ ${fmt(em,4)} = <b>${k}</b>`, `Molecular formula = (${fStr(ef)})<sub>${k}</sub> = <b>${fStr(finalF)}</b>`];
    checks = [{label:'Number of empirical units', answer:k, unit:'', tip:'n = M<sub>r</sub> ÷ mass of empirical formula', guide:`${fmt(+p.Mr)} ÷ mass of ${fStr(ef)}`}, {type:'formula', label:'Molecular formula', counts:parseFormula(finalF).counts, answerText:finalF, tip:'Multiply every subscript in the empirical formula by n.', final:true}];
    steps.push({id:'required', title:'Molecular formula', ask:'Use the M<sub>r</sub> to scale up the empirical formula.', body:lines(req), checks});
  } else {
    steps.push({id:'required', skipped:true, body:'<p>No M<sub>r</sub> was given, so the empirical formula is the answer.</p>'});
    steps[steps.length-2].checks[0].final = true;
  }
  steps.push({id:'answer', body:answerBoxText(p.Mr?'Molecular formula':'Empirical formula', fStr(finalF))});
  const sp = parseSpecies(finalF,'p');
  steps.push({id:'eco', body:ecoBody({p, eco:p.eco||{type:'note'}, formulaSp:sp, fin:{text:finalF}})});
  return {steps, final:{text:finalF}};
}

/* ---------- water of crystallisation ---------- */
function solveHydrate(p){
  const salt = parseSpecies(p.salt,'r'); const water = parseSpecies('H2O','p');
  const hyd = +p.hyd, anh = +p.anh;
  if(!(hyd>0 && anh>0 && hyd>anh)) throw new Error('The hydrated mass must be larger than the anhydrous mass.');
  const steps = [];
  const w = hyd-anh, ns = anh/salt.M, nw = w/18, x = nw/ns, xr = Math.round(x);
  steps.push({id:'question', body:`<p class="qtext">${p.qText}</p>`});
  steps.push({id:'equation', body:`<div class="eq"><span class="sp">${fH(salt)}·<i>x</i>H<sub>2</sub>O<span class="st">(s)</span></span> <span class="arrow">→</span> <span class="sp">${fH(salt)}<span class="st">(s)</span></span> <span class="op">+</span> <span class="sp"><i>x</i>H<sub>2</sub>O<span class="st">(g)</span></span></div><p class="note">Heating drives off the water of crystallisation. The mass lost is water.</p>`});
  steps.push({id:'data', ask:'Find the mass of water driven off.', body:lines([`${mrLabel(salt)} = ${mrBreak(salt)}`, `M<sub>r</sub>(H<sub>2</sub>O) = (2 × 1) + 16 = 18`, `Mass of hydrated salt = ${fmt(hyd)} g; after heating = ${fmt(anh)} g`, `Mass of water lost = ${fmt(hyd)} − ${fmt(anh)} = <b>${fmt(w)} g</b>`]),
    checks:[{label:'Mass of water', answer:w, unit:'g', tip:'Water lost = mass before heating − mass after heating', guide:`${fmt(hyd)} − ${fmt(anh)}`}]});
  steps.push({id:'moles', ask:'Convert both masses into moles.', body:lines([`n(${fH(salt)}) = ${fmt(anh)} ÷ ${fmtMr(salt.M)} = <b>${fmt(ns)} mol</b>`, `n(H<sub>2</sub>O) = ${fmt(w)} ÷ 18 = <b>${fmt(nw)} mol</b>`]),
    checks:[{label:`n(${fH(salt)})`, answer:ns, unit:'mol', tip:'n = mass ÷ M<sub>r</sub>', guide:`${fmt(anh)} ÷ ${fmtMr(salt.M)}`, wrong:[{v:hyd/salt.M, m:'Use the mass after heating for the anhydrous salt.'}]},
            {label:'n(H<sub>2</sub>O)', answer:nw, unit:'mol', tip:'n = mass ÷ 18', guide:`${fmt(w)} ÷ 18`}]});
  steps.push({id:'ratio', ask:'Find how many moles of water there are per mole of salt.', body:lines([`x = n(H<sub>2</sub>O) ÷ n(${fH(salt)}) = ${fmt(nw)} ÷ ${fmt(ns)} = ${fmt(x)} ≈ <b>${xr}</b>`]),
    checks:[{label:'x', answer:xr, unit:'', tip:'x = moles of water ÷ moles of anhydrous salt', guide:`${fmt(nw)} ÷ ${fmt(ns)}`, wrong:[{v:ns/nw, m:'Upside down: water ÷ salt.'}], final:true}]});
  steps.push({id:'required', skipped:true, body:'<p>x is the whole number you need, so there is nothing more to convert.</p>'});
  const hf = `${p.salt}.${xr}H2O`;
  steps.push({id:'answer', body:answerBoxText('Formula of the hydrated salt', fStr(hf))});
  steps.push({id:'eco', body:ecoBody({p, eco:{type:'hydrate', hydrate:hf}, fin:{value:xr}})});
  return {steps, final:{value:xr}};
}

/* ---------- dispatcher ---------- */
function solveProblem(p){
  if(p.type==='empirical') return solveEmpirical({...p, qText:p.qText || p.q(p)});
  if(p.type==='hydrate') return solveHydrate({...p, qText:p.qText || p.q(p)});
  let rx;
  if(p.customEq){ const def = {name:'Your reaction', cat:'Custom', eq:p.customEq, eco:{type:'generic'}}; rx = buildReaction(def,'custom');
    rx.emit = rx.species.filter(s=>s.side==='p' && ['CO2','SO2','NO2','NO','CO','CH4'].includes(s.f)).map(s=>s.key);
    if(p.desired) rx.desired = p.desired; }
  else if(p.sub){ rx = {single:true, species:[parseSpecies(p.sub,'r')], eco:p.eco||{type:'generic'}, emit:[]}; }
  else rx = getRx(p.rx);
  const q = p.qText || (p.q? p.q(p) : autoQuestion(p, rx));
  if(p.type==='ae') return solveAE({...p, qText:q}, rx);
  return solveReacting({...p, qText:q}, rx);
}

const TKIND = {mass:'mass', moles:'number of moles', volume:'volume', concentration:'concentration', solutionVolume:'volume', particles:'number of particles', charge:'charge', time:'time'};
function autoQuestion(p, rx){
  if(p.type==='ae'){ const d = rx.species[findSp(rx, p.desired||rx.desired)]; return `Calculate the atom economy for making ${d?fH(d):'the product'} in this reaction.`; }
  const S = rx.species; const sp = k=>S[findSp(rx,k)];
  const t = p.target, ts = sp(t.sp); if(!ts) return 'Calculate the required quantity.';
  const gtxt = p.givens.map(g=>{ const s=sp(g.sp); if(!s) return ''; if(g.kind==='charge') return `a current of ${fmt(g.I)} A flows for ${fmt(g.t)} ${ULBL[g.tUnit]}`; return `${qty(g)} of ${fH(s)}${g.kind==='volume'?' gas':''}`; });
  const isE = p.givens.some(g=>g.kind==='charge');
  const when = isE? `when ${gtxt[0]}` : p.givens.length===2? `when ${gtxt[0]} reacts with ${gtxt[1]}` : `from ${gtxt[0]}`;
  const role = ts.side==='p'? 'formed' : 'needed';
  const pur = p.purity? ` The ${fH(sp(p.givens[0].sp))} is ${p.purity}% pure.` : '';
  const yl = p.yield? ` The percentage yield is ${p.yield}%.` : '';
  const c = condInfo(p.cond);
  if(t.kind==='percentYield') return `In an experiment, ${gtxt.join(' and ')} reacted.${pur} The actual mass of ${fH(ts)} collected was ${fmt(t.actual)} ${ULBL[t.actualUnit]}. Calculate the percentage yield.`;
  if(t.kind==='purity') return `A ${fmt(t.sample)} ${ULBL[t.sampleUnit]} sample of impure ${fH(ts)} reacted completely, giving ${gtxt[0]}. Calculate the percentage purity of the sample.`;
  let what = `${TKIND[t.kind]} of ${fH(ts)} ${role}`;
  if(t.kind==='volume') what += ` (at ${c.short}, in ${ULBL[t.unit]})`;
  else if(t.kind==='mass') what += ` (in ${ULBL[t.unit]})`;
  else if(t.kind==='solutionVolume') what = `volume of ${fmt(t.conc)} mol/dm³ ${fH(ts)} ${role} (in ${ULBL[t.unit]})`;
  else if(t.kind==='concentration') what = `concentration of the ${fH(ts)} solution if ${fmt(t.vol)} ${ULBL[t.volUnit]} of it reacted`;
  else if(t.kind==='time') what = `time needed at ${fmt(t.I)} A (in ${ULBL[t.unit]})`;
  const gasNote = p.givens.some(g=>g.kind==='volume') && t.kind!=='volume' ? ` Gas volumes are measured at ${c.short}.` : '';
  return `Calculate the ${what} ${when}.${pur}${yl}${gasNote}`;
}

/* ---------- HTML snippets ---------- */
function lines(arr, cls=''){ return `<div class="calc ${cls}">${arr.map(l=>`<p>${l}</p>`).join('')}</div>`; }
function answerBox(label, v, unit){ return `<div class="answer-box"><span>${label}</span><strong>${fmt(v)}${unit? (unit==='%'?'%':' '+unit):''}</strong><em>3 significant figures</em></div>`; }
function answerBoxText(label, txt){ return `<div class="answer-box"><span>${label}</span><strong>${txt}</strong></div>`; }

const LEAF = '<svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19 13 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ECO_KICKER = {combustion:'Direct greenhouse-gas emissions', thermal:'Process emissions', atomEconomy:'Atom economy and by-products', extraction:'Ore consumption and mining waste',
  recovery:'Recovering metal from waste', microscale:'Chemical consumption', neutralisation:'Chemical use and wastewater', acidRain:'From a sample to a whole lake', fertiliser:'Nitrogen use and eutrophication',
  electrolysis:'Electricity and its energy source', precipitation:'Water treatment and solid waste', pollutionControl:'Pollution control trade-off', carbonCapture:'Carbon capture by plants',
  hydrate:'Hidden water in crystals', gasEmission:'How much space a gas takes', note:'Why this formula matters', generic:'Material flow'};
function spK(c, key){ const i = findSp(c.rx, key); return i<0? null : {i, s:c.rx.species[i], m: c.masses? c.masses[i] : null}; }
function metric(label, value, sub=''){ return `<div class="metric"><span>${label}</span><b>${value}</b>${sub?`<small>${sub}</small>`:''}</div>`; }
function table(head, rows){ return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function perLabel(c){ return c.perEquation? 'per equation (g)' : 'this batch'; }

/* Fuel comparison: energy released per m³ of greenhouse gas (r.t.p.). ΔHc values in kJ/mol (standard data-book values). */
const FUELS = [
  {id:'h2green', name:'Hydrogen from renewable electrolysis', rx:'hydrogen', f:'H2', dH:286, zero:true},
  {id:'h2grey', name:'Hydrogen made from methane', rx:'hydrogen', f:'H2', dH:286, via:'reforming'},
  {id:'methane', name:'Methane (natural gas)', rx:'methane', f:'CH4', dH:890, leak:true},
  {id:'propane', name:'Propane (LPG)', rx:'propane', f:'C3H8', dH:2220},
  {id:'octane', name:'Octane (petrol)', rx:'octane', f:'C8H18', dH:5470},
  {id:'ethanol', name:'Ethanol (biofuel)', rx:'ethanolburn', f:'C2H5OH', dH:1367, bio:true},
  {id:'coal', name:'Coal (as carbon)', rx:'coal', f:'C', dH:394},
];
const GWP_CH4 = 28; // 100-year global warming potential of methane, IPCC AR5
function fuelStats(F){
  const rx = getRx(F.rx); const fu = rx.species[findSp(rx,F.f)];
  let co2PerMol; // mol CO2 per mol fuel delivered
  if(F.zero) co2PerMol = 0;
  else if(F.via){ const r = getRx(F.via); const h = r.species[findSp(r,'H2')], c = r.species[findSp(r,'CO2')]; co2PerMol = c.coef/h.coef; }
  else { const c = rx.species[findSp(rx,'CO2')]; co2PerMol = c.coef/fu.coef; }
  const m3 = co2PerMol*0.024;
  return {...F, M:fu.M, co2PerMol, m3, perM3: m3? F.dH/1000/m3 : Infinity, perKg: F.dH/fu.M};
}
function leakAdjusted(F, leakPct){ // methane: unburned leak counted as CO2-equivalent
  const L = leakPct/100; const leakedPerBurned = L/(1-L); const co2e = F.co2PerMol + leakedPerBurned*(16*GWP_CH4/44);
  return F.dH/1000/(co2e*0.024);
}
function fuelCompare(curF){
  const rows = FUELS.map(fuelStats);
  const max = Math.max(...rows.filter(r=>isFinite(r.perM3)).map(r=>r.perM3));
  const cur = rows.find(r=>r.f===curF && !r.zero && !r.via) || null;
  const eqOf = r=>{
    const comb = eqHTML(getRx(r.rx));
    if(r.zero) return `${eqHTML(buildReaction({eq:'2H2O(l) -> 2H2(g) + O2(g)'}))} <em>(electrolysis, wind or solar power)</em><br>${comb}`;
    if(r.via) return `${eqHTML(getRx(r.via))} <em>(steam reforming)</em><br>${comb}`;
    return comb; };
  const row = r=>`<div class="frow2${cur && r.id===cur.id?' me':''}" data-fuel="${r.id}"><div class="fname"><span>${r.name}${r.bio?' *':''}</span><span class="feq">${eqOf(r)}</span><span class="fdh">ΔH<sub>c</sub> = −${r.dH} kJ/mol of ${fH(r.f)} · ${r.zero? 'no CO₂' : `${fmt(r.co2PerMol)} mol CO₂ per mol ${fH(r.f)}`}</span></div><i style="--w:${isFinite(r.perM3)? r.perM3/max*100 : 100}%" class="${isFinite(r.perM3)?'':'inf'}"></i><b data-val>${isFinite(r.perM3)? fmt(r.perM3)+' MJ' : 'no CO₂'}</b></div>`;
  const work = cur? `<p class="note">How the ${cur.name.split(' (')[0].toLowerCase()} figure is worked out: burning 1 mol releases ${fmt(cur.dH,4)} kJ and ${fmt(cur.co2PerMol)} mol CO₂ = ${fmt(cur.m3)} m³ at r.t.p., so ${fmt(cur.dH/1000,4)} MJ ÷ ${fmt(cur.m3)} m³ = <b>${fmt(cur.perM3)} MJ per m³ of CO₂</b>.</p>` : '';
  const h2 = rows.find(r=>r.id==='h2grey');
  return `<div class="fuels"><p class="cap">Beyond the textbook: energy released per m³ of CO₂ produced (higher is better for the climate). Use each equation to check a figure yourself: MJ per mol ÷ (mol CO₂ × 0.024 m³).</p>
    ${rows.map(row).join('')}
    ${work}
    <label class="slider"><span>Methane leaked before it reaches the burner: <b data-leak-out>0</b>%</span><input type="range" min="0" max="10" step="0.5" value="0" data-leak data-dh="890" data-max="${max}"></label>
    <p class="note">Leaked methane is counted as CO₂-equivalent (1 kg CH₄ ≈ ${GWP_CH4} kg CO₂ over 100 years, IPCC). Hydrogen from methane uses CH₄ + 2H₂O → CO₂ + 4H₂, so 1 mol CO₂ comes with 4 mol H₂ (${fmt(h2.perM3)} MJ per m³, before counting the energy the process needs). * Ethanol's carbon was absorbed by crops as they grew.</p></div>`;
}
const ECO = {
  combustion(c){
    const fuel = spK(c, c.eco.fuel), co2 = spK(c,'CO2'), o2 = spK(c,'O2');
    if(!co2) return {metrics:[metric('CO₂ released','0'), metric('Fuel burned', fm(fuel.m)), metric('O₂ taken from air', fm(o2.m))],
      text:'Hydrogen contains no carbon, so burning it makes only water. There are no CO₂ emissions where it is burned. Its real climate impact depends on how the hydrogen was made: from methane (which releases CO₂) or by electrolysis of water powered by renewable electricity. Level 7 calculates the second route.',
      extra: fuelCompare('H2'),
      think:'Hydrogen made from methane still releases CO₂, just at the factory instead of the exhaust. Compare its bar with methane burned directly. When is hydrogen genuinely the better choice?'};
    const ratio = co2.m/fuel.m, pc = pctEl(fuel.s,'C');
    const F = FUELS.find(x=>x.f===fuel.s.f && !x.zero && !x.via); const nFuel = c.xi*fuel.s.coef; const E = F? nFuel*F.dH : null;
    return {metrics:[metric('CO₂ released', fm(co2.m), `${fmt(c.xi*co2.s.coef*0.024)} m³ at r.t.p.`), E? metric('Energy released', fmt(E/1000)+' MJ', `${fmt(nFuel)} mol × ${fmt(F.dH,4)} kJ/mol`) : metric('CO₂ per kg of fuel', fmt(ratio)+' kg')],
      extra: fuelCompare(fuel.s.f),
      text:`Every carbon atom in ${fH(fuel.s)} ends up in a CO₂ molecule. Carbon is ${fmt(pc)}% of the fuel's mass, and each 12 g of carbon becomes 44 g of CO₂ by picking up oxygen from the air. That is why burning this fuel releases ${fmt(ratio)} times its own mass of CO₂.`+
        (c.eco.bio? ' The carbon in bio-ethanol came from CO₂ that crops absorbed by photosynthesis, so the cycle can be close to carbon-neutral. Growing, fermenting and distilling still use energy, so it is never exactly zero.' : ''),
      think:'Methane gives the most energy per m³ of CO₂ of the fossil fuels, so switching coal power stations to gas cuts emissions. Drag the leak slider: at what leak rate does gas lose its advantage over petrol? What would you check before calling a fuel "clean"?'};
  },
  thermal(c){
    const gas = spK(c, c.eco.gas); const solid = c.rx.desired? spK(c, c.rx.desired) : null;
    const n = c.xi*gas.s.coef;
    return {metrics:[metric(`${fH(gas.s)} released`, fm(gas.m)), metric('Volume at r.t.p.', fmt(n*24/1000)+' m³'), solid? metric(`${fH(solid.s)} produced`, fm(solid.m)) : ''],
      text:`This ${fH(gas.s)} comes from the carbonate itself, not from burning a fuel. Even a kiln heated entirely by renewable electricity would still release it. These are called process emissions, and they are a major reason cement and lime works are testing carbon capture.`,
      think:'A kiln heated by burning methane releases CO₂ from two sources. Name both. Which one could switching to renewable heating remove?'};
  },
  atomEconomy(c){
    const d = spK(c, c.rx.desired); const ae = aeOf(c.rx, c.rx.desired);
    const reactM = c.rx.species.reduce((a,s,i)=> a + (s.side==='r' && !s.e ? c.masses[i] : 0), 0);
    const by = c.rx.species.filter(s=>s.side==='p' && s.key!==c.rx.desired);
    const waste = reactM*(1-ae/100);
    let cmp = '', cmpTxt = '';
    if(c.eco.compare){ const o = getRx(c.eco.compare); const ae2 = aeOf(o, o.desired); cmp = metric('Compare: '+o.name.replace('Ethanol by ',''), fmt(ae2)+'%', 'atom economy'); cmpTxt = ` For comparison, ${o.name.toLowerCase()} has an atom economy of ${fmt(ae2)}%.`; }
    const full = ae>99.9;
    return {metrics:[metric('Atom economy', fmt(ae)+'%'), metric(`By-product mass (${perLabel(c)})`, full? '0' : fm(waste)), cmp],
      text: full? `All of the reactant atoms end up in ${fH(d.s)}. A 100% atom economy reaction makes no by-product. Waste can still come from reactants that never react (a yield below 100%) and from making the reactants in the first place.${c.rx.rev?' This reaction is reversible, so unreacted gases are separated and recycled back into the reactor rather than thrown away.':''}${cmpTxt}`

      think: c.eco.compare? 'Hydration of ethene has the higher atom economy, but ethene comes from crude oil and glucose comes from crops. Which route is greener overall? Give one point for each side.' : 'Is a reaction with a high atom economy automatically "green"? What else would you want to know?'};
  },
  extraction(c){
