      extra:`<label class="slider">Ore grade (% ${fH(comp.s)} in the rock) <input type="range" min="5" max="100" step="5" value="${grade}" data-ore data-comp="${comp.m}" data-metal="${met.m}"></label>`,
      text:`The metal is only part of what is dug up. ${co2? `The oxygen in ${fH(comp.s)} is removed and leaves as CO₂, and`: `The oxygen in ${fH(comp.s)} is removed, and`} every bit of rock that is not ${fH(comp.s)} becomes tailings (mining waste). Drag the slider: the lower the ore grade, the more rock must be mined, crushed and dumped for the same mass of ${fH(met.s)}.`,
      think:'Recycling scrap metal skips mining and reduction completely. Which numbers on this card would recycling reduce?'};
  },
  recovery(c){
    const met = spK(c, c.eco.metal), sac = spK(c, c.eco.sacrificial), left = spK(c, c.eco.left);
    return {metrics:[metric(`${fH(met.s)} recovered`, fm(met.m)), metric(`${fH(sac.s)} used up`, fm(sac.m)), metric(`${fH(left.s)} left in solution`, fm(left.m))],
      text:`Scrap iron is more reactive than copper, so it displaces copper from waste solutions. A cheap, plentiful metal is swapped for a more valuable one, and the copper ions no longer pollute the water. The iron does not vanish: it ends up as dissolved ${fH(left.s)}, which still needs treating.`,
      think:'Magnesium is even more reactive than iron. Why do recycling plants still use scrap iron?'};
  },
  microscale(c){
    const r = spK(c, c.eco.reagent); const n = c.xi*r.s.coef;
    return {metrics:[metric(`${fH(r.s)} used (one run)`, fmt(n)+' mol', fm(r.m)), metric(`${fH(r.s)} used (class of 30)`, fmt(n*30)+' mol', fm(r.m*30))],
      text:`Small experiments still use and waste chemicals. One run consumes ${fmt(n)} mol of ${fH(r.s)}. Across a class of 30, that is ${fm(r.m*30)} of acid that has to be bought, diluted and neutralised afterwards. Microscale chemistry shrinks experiments so that less is used and less waste is made, while the stoichiometry stays the same.`,
      think:'If you halve the mass of magnesium, what happens to the volume of hydrogen and the acid used? Check it in the Reaction Lab.'};
  },
  neutralisation(c){
    const base = spK(c, c.eco.base), salt = spK(c, c.eco.salt), acid = spK(c, c.eco.acid);
    const caps = [['NaOH',1],['Ca(OH)2',2],['CaCO3',2]].map(([f,k])=>{ const s=parseSpecies(f,'r'); const per = k/s.M*1000; return [fH(s), fmt(per)+' mol', fmt(1000/per)+' kg']; });
    const solid = salt.s.state==='s';
    return {metrics:[metric(`${fH(base.s)} consumed`, fm(base.m)), metric(`${fH(acid.s)} neutralised`, fm(acid.m)), metric(`${fH(salt.s)} formed`, fm(salt.m))],
      extra: table(['Base','H⁺ neutralised per kg','kg needed for 1000 mol H⁺'], caps),
      text:`Neutralising acid waste uses up ${fm(base.m)} of ${fH(base.s)}. The acid is not destroyed: it becomes ${fH(salt.s)}${solid?', which settles out as a solid sludge':', which stays dissolved in the water'}. Treating the water creates a new product that must be dealt with. The table uses M<sub>r</sub> values to compare how much acid each base can neutralise per kilogram.`,
      think:'Which base neutralises the most acid per kg? Why might a treatment works still choose a different one? Think about cost, safety and what happens to the salt.'};
  },
  acidRain(c){
    const acidSp = c.rx.single? c.rx.species[0] : spK(c, c.eco.acid).s;
    const conc = c.t.kind==='concentration'? c.fin.value : null;
    if(conc===null) return ECO.generic(c);
    const lake = 1e9; const n = conc*lake; const hPer = acidSp.counts.H||1; const limeMol = n*hPer/2;
    return {metrics:[metric('Acid concentration', fmt(conc)+' mol/dm³'), metric(`${fH(acidSp)} in the lake`, fm(n*acidSp.M)), metric('Ca(OH)₂ needed to neutralise', fm(limeMol*74))],
      text:`A tiny concentration matters when it is spread through a whole lake. Imagine a lake of 1 km² and 1 m deep (1.0 × 10⁹ dm³) at this concentration: n = c × V gives ${fmt(n)} mol, or ${fm(n*acidSp.M)} of ${fH(acidSp)}. Water managers add lime to neutralise acidified lakes. With the same mole-ratio method, that needs ${fm(limeMol*74)} of Ca(OH)₂.`,
      think:'Where does the sulfuric acid in rain come from? Trace it back step by step to a fuel being burned.'};
  },
  fertiliser(c){
    const d = spK(c, c.rx.desired); const pN = pctEl(d.s,'N'); const N = d.m*pN/100;
    const list = ['NH4NO3','CO(NH2)2','(NH4)2SO4','NH4Cl'].map(f=>parseSpecies(f,'p'));
    const rows = list.map(s=>{ const pc = pctEl(s,'N'); return [fH(s)+(s.f===d.s.f?' ◂':''), fmt(pc)+'%', fmt(100/(pc/100))+' kg']; });
    return {metrics:[metric(`${fH(d.s)} produced`, fm(d.m)), metric('Nitrogen by mass', fmt(pN)+'%'), metric('Nitrogen delivered', fm(N))],
      extra: table(['Fertiliser','% N by mass','Mass for 100 kg of N'], rows),
      text:`This batch delivers ${fm(N)} of nitrogen, the nutrient crops use to build proteins. Plants only take up part of what is spread. Excess nitrate dissolves in rainwater, runs into rivers and feeds algae, which leads to eutrophication. Working out the right mass of fertiliser from %N is stoichiometry on a farm.`,
      think:'A field needs 100 kg of nitrogen. Which fertiliser in the table means the least mass to transport and spread? What else would a farmer consider?'};
  },
  electrolysis(c){
    const e = spK(c,'e-'); const nE = c.xi*e.s.coef; const Q = nE*FARADAY; const V = c.eco.voltage; const J = Q*V; const kWh = J/3.6e6;
    const prod = spK(c, c.eco.product); const perKg = kWh/(prod.m/1000);
    const src = [['Coal',820],['Natural gas',490],['Solar PV',48],['Hydroelectric',24],['Nuclear',12],['Wind (onshore)',11]];
    const max = kWh*820/1000;
    const bars = src.map(([nm,gpk])=>{ const kg = kWh*gpk/1000; return `<div class="sbar"><span>${nm}</span><i style="--w:${Math.max(0.6,kg/max*100)}%"></i><b>${fm(kg*1000)}</b></div>`; }).join('');
    const notes = {Al:' Recycling aluminium skips this electrolysis step completely.', H2:' Hydrogen made with renewable electricity is called green hydrogen.', Cu:' Copper refining runs at a low voltage, so it needs far less energy per kg than aluminium smelting.'};
    const thinks = {Al:'Why are many aluminium smelters built next to hydroelectric power stations?', H2:'Compare the CO₂ from making this hydrogen with coal power against wind power. Is hydrogen automatically "zero-carbon"?', Cu:'Why is it worth refining copper to very high purity for electrical wiring?'};
    return {metrics:[metric('Charge passed', fmt(Q)+' C'), metric(`Energy at ${V} V`, fmt(kWh)+' kWh', `E = Q × V = ${fmt(J)} J`), metric(`Energy per kg of ${fH(prod.s)}`, fmt(perKg)+' kWh')],
      extra:`<div class="sources"><p class="cap">CO₂ from generating this electricity (life-cycle medians, IPCC 2014, g CO₂-eq per kWh: coal 820, gas 490, solar 48, hydro 24, nuclear 12, wind 11)</p>${bars}</div>`,
      text:`Electrolysis is driven by electricity. The stoichiometry fixes the charge needed (${fmt(Q)} C), and the cell voltage turns that charge into energy (E = Q × V). The carbon footprint of the product depends almost entirely on how that electricity is generated.${notes[prod.s.f]||''}`,
      think: thinks[prod.s.f] || 'How would the CO₂ footprint change if the plant switched from coal to wind power?'};
  },
  precipitation(c){
    const solid = spK(c, c.eco.solid); const nS = c.xi*solid.s.coef; const ionM = nS*(solid.s.counts[c.eco.ion]||1)*AR[c.eco.ion];
    const solG = c.G && c.G.find(g=>g.kind==='solution'); const Vw = solG? solG.vol*UNIT.vol[solG.volUnit] : null;
    return {metrics:[metric(`${c.eco.ion} removed from the water`, fm(ionM), Vw? `from ${fmt(Vw)} dm³ (${fmt(ionM*1000/Vw)} mg/dm³ before)`:'' ), metric(`Solid ${fH(solid.s)} formed`, fm(solid.m))],
      text: c.eco.valuable? `Silver is valuable, so precipitating it as insoluble ${fH(solid.s)} lets a waste stream become a resource. The ${fm(solid.m)} of precipitate is filtered off and the silver recovered, and the water no longer carries dissolved silver ions, which are toxic to aquatic life.`
        : `Precipitation turns dissolved ${c.eco.ion}²⁺ ions, which are toxic to aquatic life, into an insoluble solid that can be filtered out. The water is cleaner, but you now have ${fm(solid.m)} of ${fH(solid.s)} sludge that must be landfilled or sent for metal recovery.`,
      think:'Should the sludge go to landfill, or should the metal be recovered from it? What would you need to know to decide?'};
  },
  pollutionControl(c){
    const pol = spK(c, c.eco.pollutant), reag = spK(c, c.eco.reagent), rel = spK(c, c.eco.released), sol = spK(c, c.eco.solid);
    return {metrics:[metric(`${fH(pol.s)} captured`, fm(pol.m)), metric(`${fH(reag.s)} used`, fm(reag.m)), metric(`${fH(rel.s)} released`, fm(rel.m)), metric(`Solid ${fH(sol.s)}`, fm(sol.m))],
      text:`The scrubber stops ${fm(pol.m)} of SO₂ reaching the air, where it would form acid rain. The chemistry has a cost: it uses ${fm(reag.m)} of limestone that must be quarried, and it releases ${fm(rel.m)} of CO₂. The calcium sulfite is usually oxidised to calcium sulfate (gypsum) and sold to make plasterboard.`,
      think:'The scrubber swaps one pollutant for another. Why is that swap still worth making?'};
  },
  carbonCapture(c){
    const co2 = spK(c,'CO2'), glu = spK(c,'C6H12O6'), o2 = spK(c,'O2');
    const oct = getRx('octane'); const co2PerKgOct = (16*44)/(2*114.0);
    const octEq = co2.m/co2PerKgOct;
    return {metrics:[metric('CO₂ absorbed', fm(co2.m)), metric('Glucose made', fm(glu.m)), metric('O₂ released', fm(o2.m))],
      text:`Photosynthesis is combustion run backwards: 6 mol of CO₂ are locked into every mole of glucose. This is the CO₂ released by burning about ${fm(octEq)} of octane (petrol), using the ${fmt(co2PerKgOct)} kg of CO₂ per kg of octane from the combustion equation. The carbon stays stored only while the wood and leaves are not burned or left to rot.`,
      think:'A car burns 1000 kg of petrol a year. Roughly how many trees like this would it take to absorb its CO₂? What does that tell you about tree-planting as a climate solution?'};
  },
  hydrate(c){
    const h = parseSpecies(c.eco.hydrate,'r'); const x = h.counts.H? (c.eco.hydrate.split('.')[1]||'').match(/^(\d+)/) : null; const nx = x? +x[1] : 1;
    const w = nx*18/h.M*100;
    return {metrics:[metric('Water by mass in the crystal', fmt(w)+'%'), metric('Water in 1 tonne of crystals', fmt(w*10)+' kg')],
      text:`${fmt(w)}% of the mass of ${fH(h)} is water of crystallisation. Every tonne shipped carries ${fmt(w*10)} kg of water. Heating drives it off, but heating costs energy. Manufacturers choose the hydrated or anhydrous form by weighing transport mass against the energy needed to dry it.`,
      think:'Washing soda is sold as the hydrated crystal. Would it be better for the environment to sell the anhydrous powder instead? What would you need to compare?'};
  },
  gasEmission(c){
    const s = c.rx.species[0]; const n = c.G[0].n; const m = n*s.M; const V = n*24/1000;
    const cmp = (s.f==='CO2'||s.f==='CH4')? fuelCompare(s.f==='CH4'?'CH4':null) : '';
    return {extra:cmp, metrics:[metric(`Mass of ${fH(s)}`, fm(m)), metric('Moles', fmt(n)+' mol'), metric('Volume at r.t.p.', fmt(V)+' m³', `≈ ${fmt(V/240)} classrooms (10 × 8 × 3 m)`)],
      text:`Mass hides how much space a gas takes up. ${fm(m)} of ${fH(s)} spreads out to ${fmt(V)} m³ at room temperature and pressure, because every mole of any gas occupies 24 dm³.`+
        (s.f==='CH4'? ' Methane that leaks without being burned is a far stronger greenhouse gas per molecule than the CO₂ it would form if burned, so leaks matter even when the mass sounds small.' : ''),
      think: s.f==='CH4'? 'Burning 1 mol of methane makes 1 mol of CO₂. Why might burning leaked methane be better for the climate than letting it escape?' : `Why are emissions of ${fH(s)} usually reported in tonnes rather than in cubic metres?`};
  },
  note(c){
    const sp = c.formulaSp || c.tsp; const comp = sp.order.map(el=>{ const pc = pctEl(sp,el); return `<div class="sbar"><span>${el}</span><i style="--w:${pc}%"></i><b>${fmt(pc)}%</b></div>`; }).join('');
    return {metrics:[metric('Formula found', fStr(sp.f)), metric('M<sub>r</sub>', fmtMr(sp.M))], extra:`<div class="sources"><p class="cap">Composition by mass, calculated from the formula</p>${comp}</div>`,
      text:c.eco.text||'', think:c.eco.think||'', kicker:c.eco.kicker};

  generic(c){
    if(!c.masses) return {metrics:[], text:'Every stoichiometry answer describes real material: what is used up, what is made, and what is left behind.', think:'Where would the products of this reaction end up in the real world?'};
    const inM = c.rx.species.reduce((a,s,i)=>a+(s.side==='r'&&!s.e?c.masses[i]:0),0), outM = c.rx.species.reduce((a,s,i)=>a+(s.side==='p'&&!s.e?c.masses[i]:0),0);

function massBalance(c){
  if(!c.masses || c.rx.species.some(s=>s.e)) return '';
  const desired = c.rx.desired, emit = c.rx.emit||[];
  const ins = [], outs = [];
  let ri = 0;
  c.rx.species.forEach((s,i)=>{ const m = c.masses[i]; if(!(m>0)) return;
    if(s.side==='r') ins.push({lab:fH(s), m, cls:'in'+(ri++%3)});
    else outs.push({lab:fH(s), m, cls: s.key===desired? 'want' : emit.includes(s.key)? 'emit' : 'by'}); });
  if(c.excess && c.excess.g>0){ const s = c.rx.species[c.excess.i]; ins.push({lab:fH(s)+' excess', m:c.excess.g, cls:'xs'}); outs.push({lab:fH(s)+' unreacted', m:c.excess.g, cls:'xs'}); }
  const tot = ins.reduce((a,x)=>a+x.m,0);
  const bar = arr => `<div class="mbar">${arr.map(x=>`<i class="${x.cls}" style="flex-grow:${x.m/tot}" title="${x.lab.replace(/<[^>]+>/g,'')}: ${fm(x.m)}">${x.m/tot>0.14?`<span>${x.lab}</span>`:''}</i>`).join('')}</div>`;
  const leg = arr => `<ul class="mleg">${arr.map(x=>`<li><i class="${x.cls}"></i>${x.lab} <b>${fm(x.m)}</b></li>`).join('')}</ul>`;
  const keyNote = [desired? '<li><i class="want"></i>useful product</li>':'', emit.length? '<li><i class="emit"></i>emission</li>':'', '<li><i class="by"></i>by-product</li>'].join('');
  return `<details class="mb"><summary>Mass balance: mass in = mass out</summary>
    <div class="mrow"><span class="mlab">In</span>${bar(ins)}</div>${leg(ins)}
    <div class="mrow"><span class="mlab">Out</span>${bar(outs)}</div>${leg(outs)}
    <ul class="mleg key">${keyNote}</ul></details>`;
}
function yieldBlock(c){
  if(!c.p || !c.t) return '';
  let Y = null, theo = null, act = null, unit = c.unitTxt;
  if(c.t.kind==='percentYield'){ Y = c.fin.value; theo = c.fin.theo; act = c.fin.act; unit='g'; }
  else if(c.p.yield && c.fin.theo!==undefined){ Y = c.p.yield; theo = c.fin.theo; act = c.fin.value; }
  if(Y===null) return '';
  const lost = theo-act;
  return `<div class="yield"><p class="cap">Yield: material efficiency</p>
    <div class="ybar"><i style="width:${Math.min(100,Y)}%"></i></div>
    <p>Theoretical ${fmt(theo)} ${unit} · actual ${fmt(act)} ${unit} · <b>never collected: ${fmt(lost)} ${unit}</b></p>
    <p>A ${fmt(Y)}% yield means ${fmt(100-Y)}% of the possible product was lost. Those reactants were still bought, heated and processed, so a low yield wastes materials and energy even when the atom economy is high.${c.rx && c.rx.rev? ' In a reversible industrial process, unreacted gases are recycled, so the overall conversion ends up much higher than one pass.':''}</p></div>`;
}
function ecoBody(c){
  const type = (c.eco && c.eco.type) || 'generic';
  const e = (ECO[type]||ECO.generic)(c);
  const kicker = e.kicker || ECO_KICKER[type] || 'Eco connection';
  const res = c.fin && c.fin.text? fStr(c.fin.text) : c.fin? `${fmt(c.fin.value)}${c.unitTxt? (c.unitTxt==='%'?'%':' '+c.unitTxt):''}` : '';
  return `<p class="eco-kicker">${LEAF}<span>${kicker}</span></p>
    ${res? `<p class="eco-result">Stoichiometry result: <b>${res}</b></p>`:''}
    ${e.metrics && e.metrics.filter(Boolean).length? `<div class="metrics">${e.metrics.filter(Boolean).join('')}</div>`:''}
    ${e.text? `<p class="eco-text">${e.text}</p>`:''}
    ${e.extra||''}
    ${yieldBlock(c)}
    ${massBalance(c)}
    ${e.think? `<div class="think"><span>Think and discuss</span><p>${e.think}</p></div>`:''}`;
}

<script>
/* ================================================================
   EcoChem UI — student path, teacher board, reaction lab
   ================================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const PL = Object.fromEntries(PATTERN);
const reduceMotion = ()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return true; } };

function judge(c, raw){
  if(c.type==='choice') return String(raw)===String(c.answer)? {ok:true} : {ok:false, msg:c.wrongMsg||c.tip};
  if(!String(raw).trim()) return {empty:true};
  if(c.type==='formula'){
    let counts;
    try{ counts = parseFormula(String(raw).trim().replace(/\s/g,'')).counts; }catch(e){ return {ok:false, msg:'Write a formula with element symbols, for example NO2 or C2H4.'}; }
    if(sameCounts(counts, c.counts)) return {ok:true};
    const ks = Object.keys(c.counts);
    if(ks.length===Object.keys(counts).length && ks.every(k=>counts[k])){
      const r = counts[ks[0]]/c.counts[ks[0]];
      if(r>1 && Number.isInteger(r) && ks.every(k=>counts[k]===c.counts[k]*r)) return {ok:false, msg:'Right proportions, but not the simplest whole-number ratio. Divide every number by their common factor.'};
    }
    return {ok:false, msg:'Not quite. '+(c.tip||'')};
  }
  const v = parseNum(raw);
  if(isNaN(v)) return {ok:false, msg:'Enter a number, for example 0.25, 2.5e-3 or 2.5 × 10^-3.'};
  if(close(v, c.answer)) return {ok:true};
  for(const w of (c.wrong||[])) if(isFinite(w.v) && w.v!==0 && close(v, w.v)) return {ok:false, msg:w.m};
  for(const f of [1000,0.001,1e6,1e-6]) if(close(v, c.answer*f)) return {ok:false, msg:'Check your units. Your answer is out by a factor of '+fmt(f>1?f:1/f)+' (g ↔ kg ↔ t, or cm³ ↔ dm³).'};
  for(const f of [100,0.01]) if(close(v, c.answer*f)) return {ok:false, msg:'Check the decimal point. Your answer is out by a factor of 100.'};
  if(close(v, c.answer, 0.06)) return {ok:false, msg:'Very close. Keep more figures in your working and round only at the end.'};
  return {ok:false, msg:'Not quite. '+(c.tip||'')};
}

/* ---------------- Player ---------------- */
class Player{
  constructor(root, o={}){ this.root = root; this.mode = o.mode||'practice'; this.support = o.support||'guided'; this.onDone = o.onDone; this.onNext = o.onNext; this.uid = Math.random().toString(36).slice(2,7);
    root.addEventListener('submit', e=>this.onSubmit(e)); root.addEventListener('click', e=>this.onClick(e)); root.addEventListener('input', e=>this.onInput(e)); }
  load(p){ this.p = p; this.compute(); this.reset(); }
  compute(){ try{ this.sol = solveProblem(this.p); this.err = null; }catch(e){ this.sol = null; this.err = e.message; } }
  recompute(){ this.compute(); if(this.sol){ this.idx = Math.min(this.idx, this.sol.steps.length-1); } this.render(); }
  reset(){ this.idx = 0; this.work = false; this.cs = {}; this.wrong = 0; this.shown = 0; this.finished = false; this.indepDone = false; this._enter = -1;
    if(this.sol && this.mode==='practice') this.advance(false); this.render(); }
  setMode(m){ this.mode = m; this.reset(); }
  setSupport(s){ this.support = s; this.reset(); }
  get S(){ return this.sol.steps; }
  stepDone(k){ const s = this.S[k]; if(!s.checks || s.skipped) return true; return s.checks.every((c,j)=>{ const st = this.cs[k+'-'+j]; return st && st.st!=='open'; }); }
  advance(scroll=true){
    let k = this.idx; while(k < this.S.length-1 && this.stepDone(k)) k++;
    this.idx = k; this._scroll = scroll;
    if(k===this.S.length-1 && !this.finished) this.finish();
  }
  finish(){ this.finished = true; this.stars = this.shown>0? 1 : (this.wrong<=1? 3 : 2); if(this.onDone) this.onDone(this.stars); }
  finalCheck(){ for(let k=this.S.length-1;k>=0;k--){ const s=this.S[k]; if(s.checks){ const j = s.checks.findIndex(c=>c.final); if(j>=0) return {k,j,c:s.checks[j]}; } } return null; }

  /* rendering */
  render(){
    const r = this.root; r.innerHTML = '';
    if(this.err){ r.innerHTML = `<div class="error-card"><b>This calculation can't run yet.</b><p>${esc(this.err)}</p></div>`; return; }
    const list = document.createElement('div'); list.className = 'steps';
    if(this.mode==='practice' && this.support==='independent' && !this.indepDone){
      this.S.forEach((s,k)=>{ if(s.id==='question'||s.id==='equation') list.append(this.stepEl(k, true)); });
      list.append(this.indepEl());
    } else {
      for(let k=0;k<=this.idx;k++) list.append(this.stepEl(k));
    }
    r.append(list);
    r.append(this.controlsEl());
    if(this._scroll){ this._scroll = false;
      const cur = list.querySelector('.step.current') || list.lastElementChild;
      if(cur){ const rect = cur.getBoundingClientRect(); if(rect.bottom > innerHeight || rect.top < 0) cur.scrollIntoView({block:'nearest', behavior: reduceMotion()? 'auto':'smooth'});
        const inp = cur.querySelector('input'); if(inp && this.mode==='practice') inp.focus({preventScroll:true}); }
    }
  }
  railEl(){
    const ol = document.createElement('ol'); ol.className = 'rail'; ol.setAttribute('aria-label','Solution pattern');
    const indep = this.mode==='practice' && this.support==='independent' && !this.indepDone;
    this.S.forEach((s,k)=>{
      let cls = s.id==='eco'? 'eco' : '';
      if(s.skipped) cls += ' skip';
      else if(indep) cls += (s.id==='question'||s.id==='equation')? ' done' : s.id==='answer'? ' now' : '';
      else if(this.mode==='reveal'){ if(k<this.idx || (k===this.idx && (this.work || !this.S[k].checks))) cls += ' done'; if(k===this.idx) cls += ' now'; }
      else { if(k<this.idx || this.finished) cls += ' done'; else if(k===this.idx) cls += ' now'; }
      const li = document.createElement('li'); li.className = cls.trim(); li.innerHTML = (s.id==='eco'? LEAF : '') + (s.title && s.id!=='eco' ? s.title : PL[s.id]);
      ol.append(li);
    });
    return ol;
  }
  stepEl(k, forceWork=false){
    const s = this.S[k]; const title = s.title || PL[s.id];
    const isCur = k===this.idx && !(this.mode==='practice' && this.finished) && !forceWork;
    const el = document.createElement('article');
    el.className = 'step' + (s.skipped?' skipped':'') + (s.id==='eco'?' eco':'') + (isCur?' current':'') + (k===this._enter?' enter':'');
    el.innerHTML = `<span class="num">${s.id==='eco'? LEAF : k+1}</span><h3>${title}${s.skipped?' <small>not needed here</small>':''}</h3>`;
    const body = document.createElement('div'); body.className = 'body';
    if(s.skipped || !s.checks || forceWork){ body.innerHTML = s.body;
      if(s.id==='answer' && this.mode==='practice' && this.finished) body.innerHTML += this.shown? `<p class="verdict shown">Answer shown. Compare the working with yours.</p>` : `<p class="verdict ok">✓ Correct! Final answer confirmed.</p>`; }
    else if(this.mode==='reveal'){
      if(k<this.idx || this.work) body.innerHTML = s.body;
      else body.innerHTML = (s.ask? `<p class="ask">Ask the class: ${s.ask}</p>`:'') + `<div class="checks">${s.checks.map(c=>`<div class="check"><p class="ask-q">${c.label} = <span class="blank">?</span> ${c.unit||''}</p>${c.guide?`<p class="guide">${c.guide}</p>`:''}</div>`).join('')}</div>`;
    } else {
      if(this.stepDone(k)){ const keys = s.checks.map((c,j)=>this.cs[k+'-'+j]); const anyShown = keys.some(x=>x && x.st==='shown');
        body.innerHTML = s.body + (anyShown? `<p class="verdict shown">Answer shown. Read the working above, then try the next step yourself.</p>` : `<p class="verdict ok">✓ Correct! ${s.checks.length>1?'All parts of this step are right.':'This step is done.'}</p>`); }
      else body.innerHTML = (s.ask? `<p class="ask">${s.ask}</p>`:'') + `<div class="checks">${s.checks.map((c,j)=>this.checkHTML(k+'-'+j, c)).join('')}</div>`;
    }
    el.append(body);
    return el;
  }
  checkHTML(key, c, showGuide = this.support==='guided'){
    const st = this.cs[key] || {st:'open', tries:0};
    if(st.st!=='open'){
      const val = c.type==='choice'? c.options.find(o=>o.v===c.answer).html : c.type==='formula'? fStr(c.answerText) : fmt(c.answer)+' '+(c.unit||'');
      return `<div class="check ${st.st==='ok'?'ok':'shown'}"><p class="fb ${st.st==='ok'?'ok':'tip'}">${st.st==='ok'?'✓ Correct! ':'Answer shown: '}${c.label} = ${val}</p></div>`;
    }
    const id = `c${this.uid}-${key}`;
    let h = `<div class="check">`;
    if(showGuide && c.guide) h += `<p class="guide">${c.guide}</p>`;
    const helpBtns = `${this.support!=='guided' && c.tip ? `<button class="btn ghost" type="button" data-hint="${key}">Hint</button>`:''}${st.tries>=2? `<button class="btn ghost" type="button" data-show="${key}">Show me</button>`:''}`;
    if(c.type==='choice'){
      h += `<div class="crow"><b>${c.label}:</b>${c.options.map(o=>`<button class="choice" type="button" data-choice="${key}" data-v="${o.v}">${o.html}</button>`).join('')}${helpBtns}</div>`;
    } else {
      h += `<form class="crow" data-form="${key}"><label for="${id}">${c.label} =</label><input id="${id}" name="a" autocomplete="off" spellcheck="false" inputmode="${c.type==='formula'?'text':'decimal'}" value="${st.val? esc(st.val):''}" placeholder="${c.type==='formula'?'e.g. NO2':'your answer'}"><span class="unit">${c.unit||''}</span><button class="btn primary" type="submit">Check</button>${helpBtns}</form>`;
    }
    if(st.msg) h += `<p class="fb ${st.cls||''}" role="status">${st.msg}</p>`;
    return h + '</div>';
  }
  indepEl(){
    const f = this.finalCheck();
    const el = document.createElement('article'); el.className = 'step current';
    el.innerHTML = `<span class="num">?</span><h3>Your final answer <small>work it out on paper first</small></h3><div class="body"><p class="ask">Follow the pattern on paper: data, moles, mole ratio, required quantity.</p><div class="checks">${this.checkHTML('F', f.c, false)}</div></div>`;
    return el;
  }
  controlsEl(){
    const d = document.createElement('div');
    if(this.mode==='practice'){
      if(this.finished){
        const msg = this.stars===3? 'Clean solve. Try the next problem, or step up a support level.' : this.stars===2? 'Solved, with a few corrections along the way.' : 'Worked through with some steps shown. Try it again without "Show me" for more stars.';
        d.className = 'done-banner';
        d.innerHTML = `<p><span class="stars">${'★'.repeat(this.stars)}<span class="off">${'★'.repeat(3-this.stars)}</span></span> &nbsp;${msg}</p><div class="controls" style="margin:0"><button class="btn" data-act="again">Try again</button>${this.onNext? '<button class="btn primary" data-act="next">Next problem →</button>':''}</div>`;
      } else {
        d.className = 'controls';
        d.innerHTML = `<button class="btn ghost" data-act="again">Start again</button>`;
      }
      return d;
    }
    d.className = 'controls';
    const last = this.S.length-1;
    const cur = this.S[this.idx];
    let label = 'Finished';
    if(cur.checks && !cur.skipped && !this.work) label = 'Reveal working';
    else if(this.idx<last) label = 'Next: ' + (this.S[this.idx+1].title || PL[this.S[this.idx+1].id]);
    const atEnd = this.idx===last && (this.work || !cur.checks);
    d.innerHTML = `<button class="btn" data-act="prev" ${this.idx===0 && !this.work?'disabled':''}>← Back</button><button class="btn ${this.S[this.idx+1]&&this.S[this.idx+1].id==='eco' && (this.work||!cur.checks)?'eco':'primary'}" data-act="fwd" ${atEnd?'disabled':''}>${label} →</button><span class="spacer"></span><button class="btn ghost" data-act="all">Show all</button><button class="btn ghost" data-act="restart">Restart</button>`;
    return d;
  }

  /* interaction */
  fwd(){ const cur = this.S[this.idx]; if(cur.checks && !cur.skipped && !this.work){ this.work = true; }
    else if(this.idx < this.S.length-1){ this.idx++; this.work = false; this._enter = this.idx; this._scroll = true; } this.render(); }
  back(){ if(this.work){ this.work = false; } else if(this.idx>0){ this.idx--; this.work = true; } this._enter = -1; this.render(); }
  answer(key, raw){
    let c, k;
    if(key==='F'){ c = this.finalCheck().c; } else { const [a,b] = key.split('-').map(Number); k = a; c = this.S[a].checks[b]; }
    const st = this.cs[key] || (this.cs[key] = {st:'open', tries:0});
    st.val = raw;
    const res = judge(c, raw);
    if(res.empty){ st.msg = 'Type an answer first.'; st.cls = 'bad'; this.render(); return; }
    if(res.ok){ st.st = 'ok'; st.msg = ''; } else { st.tries++; this.wrong++; st.msg = res.msg; st.cls = 'bad'; }
    if(key==='F'){ if(res.ok) this.completeIndependent(); else this.render(); return; }
    if(res.ok && this.stepDone(k)){ this._enter = k+1; this.advance(); }
    this.render();
  }
  completeIndependent(){
    this.indepDone = true;
    this.S.forEach((s,k)=>(s.checks||[]).forEach((c,j)=>{ this.cs[k+'-'+j] = {st:'ok'}; }));
    this.idx = this.S.length-1; this._scroll = true; this.finish(); this.render();
  }
  onSubmit(e){ const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault(); this.answer(f.dataset.form, f.elements.a.value); }
  onInput(e){
    if(e.target.matches('input[data-leak]')){ const L = +e.target.value; const box = e.target.closest('.fuels'); const max = +e.target.dataset.max;
      const v = leakAdjusted(FUELS.map(fuelStats).find(f=>f.id==='methane'), L); const row = $('[data-fuel="methane"]', box);
      $('[data-leak-out]', box).textContent = L; row.querySelector('i').style.setProperty('--w', (v/max*100)+'%'); row.querySelector('[data-val]').textContent = fmt(v)+' MJ'; return; }
    if(e.target.matches('input[data-ore]')){ const g = +e.target.value; const comp = +e.target.dataset.comp, met = +e.target.dataset.metal; const ore = comp/(g/100);
      const card = e.target.closest('.body'); $('[data-grade-out]',card).textContent = g; $('[data-ore-out]',card).textContent = fm(ore); $('[data-waste-out]',card).textContent = fm(ore-met); }
  }
  onClick(e){
    const b = e.target.closest('button'); if(!b || !this.root.contains(b)) return;
    if(b.dataset.choice){ this.answer(b.dataset.choice, b.dataset.v); return; }
    if(b.dataset.hint){ const key = b.dataset.hint; const st = this.cs[key] || (this.cs[key] = {st:'open', tries:0});
      const c = key==='F'? this.finalCheck().c : this.S[+key.split('-')[0]].checks[+key.split('-')[1]];
      st.hints = (st.hints||0)+1; st.msg = st.hints>1 && c.guide? `${c.tip}<br>Set up: ${c.guide}` : c.tip; st.cls = 'tip';
      const inp = b.closest('form') && b.closest('form').elements.a; if(inp) st.val = inp.value; this.render(); return; }
    if(b.dataset.show){ const key = b.dataset.show; const st = this.cs[key] || (this.cs[key] = {}); st.st = 'shown'; this.shown++;
      if(key==='F'){ this.completeIndependent(); return; }
      const k = +key.split('-')[0]; if(this.stepDone(k)){ this._enter = k+1; this.advance(); } this.render(); return; }
    const act = b.dataset.act;
    if(act==='again'||act==='restart') this.reset();
    else if(act==='next' && this.onNext) this.onNext();
    else if(act==='fwd') this.fwd();
    else if(act==='prev') this.back();
    else if(act==='all'){ this.idx = this.S.length-1; this.work = true; this.render(); }
  }
}

const spName = s=> s.e? 'e⁻ (electrons)' : plain(fH(s)) + (s.side==='r'? ' · reactant':' · product');
function amountFields(pre, g, rx){
  const s = rx.species[findSp(rx,g.sp)];
  const kinds = s && s.e? [['charge','Current × time']] : [['mass','Mass'],['volume','Gas volume'],['solution','Solution'],['moles','Moles']];
  if(!kinds.some(k=>k[0]===g.kind)) g.kind = kinds[0][0];
  if(g.kind==='mass' && !['g','kg','t'].includes(g.unit)) g.unit = 'g';
  if(g.kind==='volume' && !['cm3','dm3','m3'].includes(g.unit)) g.unit = 'dm3';
  let h = sel(pre+'_kind', kinds, g.kind, 'Given as');
  if(g.kind==='mass') h += `<div class="frow">${inp(pre+'_value',g.value,'Mass')}${sel(pre+'_unit',[['g','g'],['kg','kg'],['t','t']],g.unit,'Unit')}</div>`;
  if(g.kind==='volume') h += `<div class="frow">${inp(pre+'_value',g.value,'Volume')}${sel(pre+'_unit',[['cm3','cm³'],['dm3','dm³'],['m3','m³']],g.unit,'Unit')}</div>`;
  if(g.kind==='solution') h += `<div class="frow">${inp(pre+'_conc',g.conc,'Conc. (mol/dm³)')}${inp(pre+'_vol',g.vol,'Volume')}${sel(pre+'_volUnit',[['cm3','cm³'],['dm3','dm³']],g.volUnit,'Unit')}</div>`;

function targetFields(t, rx){
  const s = rx.species[findSp(rx,t.sp)];
  const kinds = s && s.e? [['charge','Charge (C)'],['time','Time']] : [['mass','Mass'],['moles','Moles'],['volume','Gas volume'],['solutionVolume','Volume of a solution'],['concentration','Concentration'],['particles','Number of particles']];
  if(!kinds.some(k=>k[0]===t.kind)) t.kind = kinds[0][0];
  let h = sel('tg_kind', kinds, t.kind, 'Find the');

  if(t.kind==='volume'){ if(!['cm3','dm3','m3'].includes(t.unit)) t.unit='dm3'; h += sel('tg_unit',[['cm3','cm³'],['dm3','dm³'],['m3','m³']],t.unit,'In'); }
  if(t.kind==='solutionVolume'){ if(!['cm3','dm3'].includes(t.unit)) t.unit='cm3'; h += `<div class="frow">${inp('tg_conc',t.conc,'Its conc. (mol/dm³)')}${sel('tg_unit',[['cm3','cm³'],['dm3','dm³']],t.unit,'In')}</div>`; }
  if(t.kind==='concentration') h += `<div class="frow">${inp('tg_vol',t.vol,'Volume of it')}${sel('tg_volUnit',[['cm3','cm³'],['dm3','dm³']],t.volUnit,'Unit')}</div>`;

  return h;

function ensureSpecies(rx){
  const keys = rx.species.map(s=>s.key); const reacts = rx.species.filter(s=>s.side==='r').map(s=>s.key); const prods = rx.species.filter(s=>s.side==='p').map(s=>s.key);
  if(LAB.type==='limiting'){ if(!reacts.includes(LAB.ga.sp)) LAB.ga.sp = reacts[0]; if(!reacts.includes(LAB.gb.sp) || LAB.gb.sp===LAB.ga.sp) LAB.gb.sp = reacts.find(k=>k!==LAB.ga.sp) || reacts[0]; }
  else if(!keys.includes(LAB.ga.sp)) LAB.ga.sp = reacts[0];
  if(!keys.includes(LAB.tg.sp)) LAB.tg.sp = prods[0];
  if(LAB.type==='yield' && !prods.includes(LAB.tg.sp)) LAB.tg.sp = prods[0];
  if(LAB.type==='purity' && !reacts.includes(LAB.tg.sp)) LAB.tg.sp = reacts[0];
  if(LAB.type==='purity' && LAB.ga.sp===LAB.tg.sp) LAB.ga.sp = prods.find(k=>k!==LAB.tg.sp) || prods[0];
  if(LAB._lastRx!==LAB.rx){ LAB._lastRx = LAB.rx; LAB.desired = rx.desired && prods.includes(rx.desired)? rx.desired : prods[0]; }
  if(!prods.includes(LAB.desired)) LAB.desired = rx.desired && prods.includes(rx.desired)? rx.desired : prods[0];
}

      ${inp('emp_Mr',LAB.emp.Mr,'M<sub>r</sub> of compound (optional)')}</div>`;
  } else if(T==='hydrate'){
    h += `<div class="fgroup">${inp('hyd_salt',LAB.hyd.salt,'Anhydrous salt formula','text')}<div class="frow">${inp('hyd_hyd',LAB.hyd.hyd,'Hydrated mass (g)')}${inp('hyd_anh',LAB.hyd.anh,'Mass after heating (g)')}</div></div>`;
  } else {
    const groups = {}; Object.entries(RX).forEach(([id,r])=>{ (groups[r.cat] = groups[r.cat]||[]).push([id,r.name]); });
    h += `<div class="fgroup"><div class="field"><label for="rx">Reaction</label><select id="rx" name="rx">${Object.entries(groups).map(([c,arr])=>`<optgroup label="${c}">${arr.map(([v,l])=>opt(v,l,LAB.rx)).join('')}</optgroup>`).join('')}<optgroup label="Your own">${opt('custom','Type an equation…',LAB.rx)}</optgroup></select></div>`;
    if(LAB.rx==='custom') h += `<div class="field"><label for="custom">Balanced equation</label><textarea id="custom" name="custom" rows="2" spellcheck="false">${esc(LAB.custom)}</textarea></div><p class="hint-line">Use -> for the arrow, (s) (l) (g) (aq) for states, ^2+ for ion charges and e- for electrons. Example: Zn + 2HCl -> ZnCl2 + H2</p><button class="btn" type="button" data-act="applyeq">Use this equation</button>`;
    const rx = labRx();
    if(!rx){ h += `<p class="err">${LAB.rx==='custom'? 'That equation could not be read. Check the formulae and the arrow.':''}</p></div>`; }
    else {
      ensureSpecies(rx);
      h += `<div class="eq" style="font-size:1rem">${eqHTML(rx)}</div></div>`;
      const all = rx.species.map(s=>[s.key, spName(s)]); const reacts = rx.species.filter(s=>s.side==='r').map(s=>[s.key, spName(s)]); const prods = rx.species.filter(s=>s.side==='p').map(s=>[s.key, spName(s)]);
      if(T==='ae'){
        h += `<div class="fgroup">${sel('desired', prods, LAB.desired, 'Desired product')}</div>`;
      } else {
        h += `<div class="fgroup"><p class="eyebrow">You know</p>${sel('ga_sp', T==='limiting'? reacts : all, LAB.ga.sp, T==='limiting'?'First reactant':'Substance')}${amountFields('ga', LAB.ga, rx)}`;
        if(T==='limiting') h += `<hr style="border:0;border-top:1px dashed var(--line);width:100%;margin:4px 0">${sel('gb_sp', reacts, LAB.gb.sp, 'Second reactant')}${amountFields('gb', LAB.gb, rx)}`;
        h += `</div><div class="fgroup"><p class="eyebrow">You want</p>`;
        if(T==='yield') h += `${sel('tg_sp', prods, LAB.tg.sp, 'Product')}<div class="frow">${inp('act_value',LAB.actual.value,'Actual mass collected')}${sel('act_unit',[['g','g'],['kg','kg'],['t','t']],LAB.actual.unit,'Unit')}</div>`;
        else if(T==='purity') h += `${sel('tg_sp', reacts, LAB.tg.sp, 'Impure reactant')}<div class="frow">${inp('smp_value',LAB.sample.value,'Mass of impure sample')}${sel('smp_unit',[['g','g'],['kg','kg'],['t','t']],LAB.sample.unit,'Unit')}</div>`;
        else h += `${sel('tg_sp', all, LAB.tg.sp, 'Substance')}${targetFields(LAB.tg, rx)}`;
        const used = LAB.purity!==''||LAB.yield!==''||LAB.cond.type!=='rtp';
        h += `</div><details class="fgroup more"${used?' open':''}><summary>More options</summary><div class="frow">`;
        if(T==='reacting') h += inp('purity', LAB.purity, 'Purity % (optional)');
        if(T==='reacting'||T==='limiting') h += inp('yield', LAB.yield, 'Yield % (optional)');
        h += `</div>${sel('cond',[['rtp','r.t.p. (24 dm³/mol)'],['stp','s.t.p. (22.4 dm³/mol)'],['custom','Other T and p (pV = nRT)']],LAB.cond.type,'Gas conditions')}`;
        if(LAB.cond.type==='custom') h += `<div class="frow">${inp('condT',LAB.cond.T,'T (K)')}${inp('condP',LAB.cond.p,'p (kPa)')}</div>`;
        h += `</details>`;
      }
    }
  }
  h += `<p class="err" id="labErr" role="alert"></p><button class="btn primary" type="submit">Solve step by step</button>`;
  f.innerHTML = h;
}
function readLabForm(){
  const f = $('#labForm'); const v = id=>{ const el = f.elements[id]; return el? el.value : undefined; };
  const num = (id, fb)=>{ const x = v(id); if(x===undefined) return fb; const n = parseNum(x); return isNaN(n)? x : n; };
  if(v('type')) LAB.type = v('type');
  if(v('rx')) LAB.rx = v('rx');
  if(v('custom')!==undefined) LAB.custom = v('custom');
  if(v('desired')) LAB.desired = v('desired');
  ['ga','gb'].forEach(pre=>{ const g = LAB[pre]; if(v(pre+'_sp')) g.sp = v(pre+'_sp'); if(v(pre+'_kind')) g.kind = v(pre+'_kind');
    ['value','conc','vol','I','t'].forEach(k=>{ if(v(pre+'_'+k)!==undefined) g[k] = num(pre+'_'+k); });
    ['unit','volUnit','tUnit'].forEach(k=>{ if(v(pre+'_'+k)) g[k] = v(pre+'_'+k); }); });
  const t = LAB.tg; if(v('tg_sp')) t.sp = v('tg_sp'); if(v('tg_kind')) t.kind = v('tg_kind');
  ['conc','vol','I'].forEach(k=>{ if(v('tg_'+k)!==undefined) t[k] = num('tg_'+k); }); ['unit','volUnit'].forEach(k=>{ if(v('tg_'+k)) t[k] = v('tg_'+k); });
  if(v('act_value')!==undefined){ LAB.actual.value = num('act_value'); LAB.actual.unit = v('act_unit'); }
  if(v('smp_value')!==undefined){ LAB.sample.value = num('smp_value'); LAB.sample.unit = v('smp_unit'); }
  if(v('purity')!==undefined) LAB.purity = v('purity'); if(v('yield')!==undefined) LAB.yield = v('yield');
  if(v('cond')) LAB.cond.type = v('cond'); if(v('condT')!==undefined) LAB.cond.T = num('condT'); if(v('condP')!==undefined) LAB.cond.p = num('condP');
  if(v('emp_mode')) LAB.emp.mode = v('emp_mode');
  LAB.emp.rows.forEach((r,i)=>{ if(v('emp_el'+i)!==undefined){ r[0] = v('emp_el'+i).trim(); r[1] = num('emp_v'+i); } });
  if(v('emp_Mr')!==undefined) LAB.emp.Mr = v('emp_Mr');
  if(v('hyd_salt')!==undefined){ LAB.hyd.salt = v('hyd_salt').trim(); LAB.hyd.hyd = num('hyd_hyd'); LAB.hyd.anh = num('hyd_anh'); }
}
function labSpec(){
  const T = LAB.type;
  const pct = (x,name)=>{ if(x===''||x===undefined||x===null) return null; const n = parseNum(x); if(!(n>0 && n<=100)) throw new Error(name+' must be a number between 0 and 100.'); return n; };
  if(T==='empirical'){
    const rows = LAB.emp.rows.filter(r=>r[0]); rows.forEach(r=>{ if(!(r[1]>0)) throw new Error(`Enter a positive amount for ${r[0]}.`); });
    const Mr = LAB.emp.Mr===''? null : parseNum(LAB.emp.Mr); if(Mr!==null && !(Mr>0)) throw new Error('M<sub>r</sub> must be a positive number.');
    const u = LAB.emp.mode==='percent'? '%' : ' g';
    return {type:'empirical', mode:LAB.emp.mode, data:rows.map(r=>[r[0],r[1]]), Mr,
      eco:{type:'note', kicker:'Why this formula matters', text:'Composition analysis is how chemists identify unknown substances, from the gases in a car exhaust to contaminants in drinking water. Once the formula is known, every other stoichiometry calculation about that substance becomes possible.', think:'Where might you meet this compound in the environment, and is it useful or a pollutant there?'},
      qText:`A compound contains ${rows.map(r=>`${fmt(r[1])}${u} ${r[0]}`).join(', ')} by mass. Find its empirical formula${Mr? `. Its M<sub>r</sub> is ${fmt(Mr)}, so also find its molecular formula`:''}.`};
  }
  if(T==='hydrate'){ const s = LAB.hyd.salt; return {type:'hydrate', salt:s, hyd:LAB.hyd.hyd, anh:LAB.hyd.anh, qText:`${fmt(+LAB.hyd.hyd)} g of hydrated ${fStr(s)}·xH₂O is heated until all the water of crystallisation has gone. ${fmt(+LAB.hyd.anh)} g of anhydrous ${fStr(s)} remains. Find x.`}; }
  const base = LAB.rx==='custom'? {customEq:LAB.custom} : {rx:LAB.rx};
  if(T==='ae') return {...base, type:'ae', desired:LAB.desired};
  const strip = g=>{ const o = {sp:g.sp, kind:g.kind}; if(['mass','volume','moles'].includes(g.kind)){ o.value=g.value; o.unit=g.unit||'g'; if(g.kind==='moles') delete o.unit; }
    if(g.kind==='solution'){ o.conc=g.conc; o.vol=g.vol; o.volUnit=g.volUnit; } if(g.kind==='charge'){ o.I=g.I; o.t=g.t; o.tUnit=g.tUnit; } return o; };
  const givens = [strip(LAB.ga)]; if(T==='limiting') givens.push(strip(LAB.gb));
  givens.forEach(g=>['value','conc','vol','I','t'].forEach(k=>{ if(k in g && typeof g[k]!=='number') throw new Error('One of the amounts is not a number. Use digits, for example 2.5 or 2.5e-3.'); }));
  let target;
  if(T==='yield'){ if(!(LAB.actual.value>0)) throw new Error('Enter the actual mass collected.'); target = {sp:LAB.tg.sp, kind:'percentYield', actual:LAB.actual.value, actualUnit:LAB.actual.unit}; }
  else if(T==='purity'){ if(!(LAB.sample.value>0)) throw new Error('Enter the mass of the impure sample.'); target = {sp:LAB.tg.sp, kind:'purity', sample:LAB.sample.value, sampleUnit:LAB.sample.unit}; }
  else { const t = LAB.tg; target = {sp:t.sp, kind:t.kind, unit:t.unit};
    if(t.kind==='solutionVolume'){ if(!(t.conc>0)) throw new Error('Enter the concentration of the solution you are finding the volume of.'); target.conc = t.conc; }
    if(t.kind==='concentration'){ if(!(t.vol>0)) throw new Error('Enter the volume of the solution whose concentration you want.'); target.vol = t.vol; target.volUnit = t.volUnit; delete target.unit; }
    if(t.kind==='time'){ if(!(t.I>0)) throw new Error('Enter the current.'); target.I = t.I; }
    if(t.kind==='moles') target.unit = 'mol'; }
  const spec = {...base, givens, target, cond:{...LAB.cond}};
  if(LAB.cond.type==='custom' && !(LAB.cond.T>0 && LAB.cond.p>0)) throw new Error('Enter a positive temperature in K and pressure in kPa.');
  if(T==='reacting'){ const p = pct(LAB.purity,'Purity'); if(p) spec.purity = p; }
  if(T==='reacting'||T==='limiting'){ const y = pct(LAB.yield,'Yield'); if(y) spec.yield = y; }
  return spec;
}
function solveLab(){
  try{
    const spec = labSpec();
    const rx = (LAB.type==='empirical'||LAB.type==='hydrate')? null : labRx();
    $('#labTitle').textContent = rx? rx.name : LAB_TYPES.find(t=>t[0]===LAB.type)[1];
    $('#labMeta').textContent = 'Reaction Lab · ' + LAB_TYPES.find(t=>t[0]===LAB.type)[1];
    labPlayer.load(spec);
    if(labPlayer.sol && labPlayer.mode==='reveal'){ labPlayer.idx = labPlayer.S.length-1; labPlayer.work = true; labPlayer.render(); }
    if(labPlayer.err) $('#labErr').innerHTML = esc(labPlayer.err);
  }catch(e){ $('#labErr').innerHTML = e.message; }
}
$('#labForm').addEventListener('change', e=>{ if(e.target.tagName==='SELECT'){ readLabForm(); renderLabForm(); } });
$('#labForm').addEventListener('click', e=>{ const b = e.target.closest('[data-act="applyeq"]'); if(b){ readLabForm(); renderLabForm(); } });
$('#labForm').addEventListener('submit', e=>{ e.preventDefault(); readLabForm(); renderLabForm(); solveLab(); });
$('#labModeSeg').addEventListener('click', e=>{ const b = e.target.closest('button'); if(!b) return; LAB.mode = b.dataset.m; $$('#labModeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); labPlayer.setMode(LAB.mode); });

/* ---------------- routing ---------------- */
const VIEWS = ['path','lab'];
function show(view){
  if(!VIEWS.includes(view)) view = 'path';
  VIEWS.forEach(v=>{ $('#view-'+v).hidden = v!==view; $('#tab-'+v).setAttribute('aria-selected', String(v===view)); });
}
$$('.tab').forEach(t=>t.addEventListener('click', ()=>{ const v = t.dataset.view; try{ history.replaceState(null,'','#'+v); }catch(e){} show(v); }));
addEventListener('hashchange', ()=>show(location.hash.slice(1)));

/* ---------------- boot ---------------- */
(function boot(){
  const saved = store.get('ecochem.cur', null);
  const first = (saved && BANK.some(p=>p.id===saved))? saved : (BANK.find(p=>!progress[p.id])||BANK[0]).id;
  loadPath(first);
  renderLabForm(); solveLab();
  show(location.hash.slice(1) || 'path');
})();
